name: Compilar APK SportStream

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Descomprimir Android original (con logos)
        run: unzip android.zip

      - name: Instalar dependencias
        run: npm install

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Dar permisos a Gradle
        run: chmod +x android/gradlew

      - name: Construir APK Debug
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Subir la APK
        uses: actions/upload-artifact@v4
        with:
          name: SportStream-APK-Prueba
          path: android/app/build/outputs/apk/debug/app-debug.apk
