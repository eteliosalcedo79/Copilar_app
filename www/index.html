<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Catálogo + Addon Latam</title>

<!-- AGREGADO: HLS.js para reproducir el video real -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&display=swap" rel="stylesheet">

<style>
:root {
  --bg:          #080d14;
  --panel:       #0f1319;
  --card:        #141920;
  --surface:     #0e1822;
  --border:      #1a2a3a;
  --accent:      #00cc44;
  --accent2:     #00b0ff;
  --accent-glow: rgba(0,204,68,.25);
  --accent-dim:  rgba(0,204,68,.15);
  --red:         #ff1744;
  --gold:        #ffd600;
  --text:        #e8f0f8;
  --text-sub:    #5a6478;
  --radius:      12px;

  --tv-topbar-h: clamp(48px, 5.5vh, 64px);
  --tv-player-w: clamp(320px, 48vw, 720px);
}

*, *::before, *::after {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: linear-gradient(rgba(8,13,20,0.4), rgba(8,13,20,0.8)), url('fondo_canales.webp?v=4') center/cover no-repeat fixed #06090e;
  color: var(--text);
  font-family: 'Rajdhani', system-ui, -apple-system, sans-serif;
  touch-action: manipulation;
}

/* ══════ BARRA SUPERIOR ══════ */
.logo-footer {
  position: fixed; top: 0; left: 0; width: 100%; height: var(--tv-topbar-h);
  display: flex; justify-content: flex-end; align-items: center; gap: 6px;
  padding: 0 12px; background: rgba(15,19,25,0.6);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid rgba(255,255,255,0.05); z-index: 50;
}
.top-actions { display: flex; gap: 8px; align-items: center; }
.action-btn {
  padding: 8px clamp(12px, 1.6vw, 20px); border-radius: 10px;
  font-weight: 700; font-size: clamp(11px, 1.1vw, 13px);
  cursor: pointer; border: none; transition: all 0.2s ease;
  text-transform: uppercase; letter-spacing: 0.6px;
  font-family: inherit; outline: none; white-space: nowrap;
  height: clamp(34px, 4.2vh, 44px);
}
.action-btn.primary { background: var(--accent); color: #000; box-shadow: 0 4px 10px rgba(0,204,68,0.3); }
.action-btn.primary:hover, .action-btn.primary:focus-visible { background: #00e64d; }
.action-btn.proxy { background: var(--surface); color: var(--text); border: 1px solid var(--border); }
.action-btn.proxy.on { background: var(--gold); color: #000; border-color: var(--gold); }

/* ══════ ÁREA IZQUIERDA ══════ */
.main-area {
  position: fixed; top: var(--tv-topbar-h); left: 0; right: var(--tv-player-w); bottom: 0;
  display: flex; flex-direction: column; overflow: hidden; background: transparent;
}

/* ── CATEGORÍAS ── */
.categories-bar {
  flex-shrink: 0; display: flex; align-items: center; gap: 8px;
  padding: 10px 12px; overflow-x: auto; overflow-y: hidden;
  background: rgba(15,19,25,0.4); backdrop-filter: blur(8px);
  border-bottom: 1px solid rgba(255,255,255,0.05);
  scrollbar-width: none; min-height: 60px;
}
.categories-bar::-webkit-scrollbar { display: none; }
.category-btn {
  flex-shrink: 0; padding: 10px 18px;
  background: transparent; color: var(--text-sub);
  border: none; border-radius: 10px; cursor: pointer;
  font-size: clamp(11px, 1.1vw, 13px); font-weight: 700;
  text-transform: uppercase; letter-spacing: 0.6px; white-space: nowrap;
  transition: all 0.2s ease; outline: none; font-family: inherit;
}
.category-btn.active {
  background: linear-gradient(90deg, #1f2937 0%, var(--accent) 40%, var(--accent) 100%);
  color: #fff; box-shadow: 0 4px 15px rgba(0,204,68,0.3);
}
.category-btn:focus-visible { box-shadow: inset 0 0 0 3px var(--accent2), 0 0 14px rgba(0,176,255,0.55); }

/* ── GRID DE PORTADAS ── */
.poster-grid {
  flex: 1; overflow-y: auto; overflow-x: hidden; padding: 10px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
  gap: 8px; align-content: start; scrollbar-width: thin;
}
.poster-card { cursor: pointer; outline: none; transition: transform 0.2s ease; }
.poster-card:hover, .poster-card:focus { transform: scale(1.05); z-index: 10; }
.poster-card img {
  width: 100%; aspect-ratio: 2 / 3; object-fit: cover;
  border-radius: 6px; background: #111; border: 2px solid transparent;
  display: block; transition: border-color 0.2s, box-shadow 0.2s;
}
.poster-card:focus-visible img { border-color: var(--accent2); box-shadow: 0 0 12px rgba(0,176,255,0.5); }
.poster-card.now-playing img { border-color: var(--accent); box-shadow: 0 0 12px var(--accent-glow); }
.poster-card .name {
  font-size: clamp(0.55rem, 0.8vw, 0.7rem); margin-top: 4px;
  font-weight: 600; text-align: center;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

/* ══════ VISTA DE DETALLES ══════ */
#detailView {
  display: none; 
  position: absolute; inset: 0; z-index: 20;
  background-color: #06090e; background-size: cover; background-position: center;
  overflow-y: auto; scrollbar-width: none;
}
#detailView::-webkit-scrollbar { display: none; }
.detail-content {
  display: flex; flex-direction: column; min-height: 100%;
  justify-content: flex-end; padding: clamp(20px, 4vw, 40px);
  padding-top: 100px; position: relative;
}
.detail-content::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(to top, #06090e 0%, rgba(6,9,14,0.85) 45%, transparent 100%);
  z-index: -1; pointer-events: none;
}
.detail-logo { max-width: min(350px, 80%); max-height: 140px; object-fit: contain; margin-bottom: 16px; align-self: flex-start; filter: drop-shadow(0 4px 12px rgba(0,0,0,0.9)); }
.detail-title { font-family: 'Orbitron', sans-serif; font-size: clamp(1.5rem, 3vw, 2.5rem); font-weight: 900; color: #fff; margin-bottom: 8px; line-height: 1.1; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }
.detail-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-size: clamp(0.75rem, 1.2vw, 0.95rem); color: #c3cfdc; font-weight: 600; margin-bottom: 8px; }
.detail-meta span.dot { color: var(--text-sub); font-size: 1.2em; margin: 0 4px; }
.imdb-badge { background: #f5c518; color: #000; font-family: sans-serif; font-weight: 900; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; letter-spacing: 0.5px; }
.detail-desc { font-size: clamp(0.9rem, 1.4vw, 1.15rem); line-height: 1.5; color: #ffffff; font-weight: 700; max-width: 800px; margin-bottom: 24px; text-shadow: 0 1px 4px rgba(0,0,0,0.9); }
.btn-play-large {
  display: flex; align-items: center; gap: 10px;
  background: var(--accent); color: #000;
  padding: clamp(10px, 1.5vh, 16px) clamp(24px, 3vw, 40px); 
  border-radius: 30px; border: 2px solid transparent;
  font-family: 'Rajdhani', sans-serif; font-size: clamp(0.9rem, 1.5vw, 1.1rem);
  font-weight: 800; text-transform: uppercase; letter-spacing: 1px;
  cursor: pointer; transition: all 0.2s ease; width: fit-content; outline: none;
  box-shadow: 0 4px 15px rgba(0,204,68,0.4);
}
.btn-play-large:focus-visible { border-color: var(--accent2); box-shadow: 0 0 15px rgba(0,176,255,0.6); }

/* ══════ REPRODUCTOR ══════ */
.player-col {
  position: fixed; top: var(--tv-topbar-h); right: 0;
  width: var(--tv-player-w); height: calc(100% - var(--tv-topbar-h));
  display: flex; flex-direction: column; justify-content: center;
  padding: clamp(10px, 2vh, 20px) clamp(4px, 0.8vw, 10px);
  padding-bottom: clamp(24px, 6vh, 64px); background: transparent; z-index: 10;
}
.player-container {
  position: relative; width: 100%; aspect-ratio: 16 / 9;
  max-height: calc(100vh - var(--tv-topbar-h) - 40px);
  background: #0a1a0e url('player_bg.webp') center/cover no-repeat;
  border-radius: 10px; overflow: hidden; box-shadow: 0 0 24px rgba(0,0,0,0.6);
  display: flex; align-items: center; justify-content: center; flex: 0 0 auto;
  cursor: pointer; outline: none; transition: box-shadow 0.2s;
}
.player-container:focus-visible { box-shadow: inset 0 0 0 3px var(--accent2), 0 0 14px rgba(0,176,255,0.55); }
.player-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.32); z-index: 1; pointer-events: none; }
.player-content { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; width: 100%; height: 100%; }
.player-msg { font-family: 'Orbitron', monospace; font-size: clamp(0.85rem, 1.8vmin, 1.15rem); font-weight: 700; color: var(--accent); letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 10px rgba(0,0,0,0.9), 0 0 20px rgba(0,204,68,0.6); }
.player-msg.sim-playing { color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,1); }
.player-msg .sim-title { display: block; color: var(--accent); font-size: clamp(1rem, 2.2vmin, 1.4rem); margin-bottom: 6px; }
.player-msg .sim-sub { display: block; color: #c3cfdc; font-family: 'Rajdhani', sans-serif; font-size: clamp(0.7rem, 1.2vmin, 0.9rem); font-weight: 600; text-transform: none; }

/* AGREGADO: Estilos para el video real */
#iptv-player {
  position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; z-index: 5; background: #000; display: none;
}

.player-status {
  flex-shrink: 0; margin-top: clamp(10px, 1.6vh, 16px); padding: 0 6px;
  display: flex; justify-content: space-between; align-items: center; gap: 10px;
  font-family: 'Rajdhani', sans-serif; font-size: clamp(0.7rem, 1vw, 0.85rem); font-weight: 600; color: var(--text-sub);
}
.player-status #currentCatName { color: var(--accent); font-weight: 700; text-transform: uppercase; }
.loader { display: inline-block; width: 10px; height: 10px; border: 2px solid rgba(0,204,68,0.2); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; margin-right: 4px; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ══════ MODAL DE FUENTES ══════ */
.sources-modal {
  position: fixed; top: var(--tv-topbar-h); left: 0; right: var(--tv-player-w); bottom: 0;
  background: rgba(6,9,14,0.9); z-index: 800; display: none;
  flex-direction: column; align-items: center; justify-content: center;
  backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); padding: 20px;
}
.sources-modal.open { display: flex; animation: fadeIn 0.2s ease; }
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.sources-pills { display: flex; gap: 10px; margin-bottom: 20px; overflow-x: auto; width: 100%; max-width: 600px; scrollbar-width: none; padding-bottom: 5px; }
.sources-pills::-webkit-scrollbar { display: none; }
.source-pill {
  background: var(--surface); color: var(--text); border: 1px solid var(--border);
  padding: 8px 16px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: 0.2s;
}
.source-pill.active { background: var(--accent); color: #000; border-color: var(--accent); }
.source-pill:focus-visible { border-color: var(--accent2); outline: none; box-shadow: inset 0 0 0 2px var(--accent2); }

.sources-list-box { width: 100%; max-width: 600px; background: var(--card); border-radius: 12px; border: 1px solid var(--border); overflow: hidden; display: flex; flex-direction: column; max-height: 60vh; overflow-y: auto; }
.sources-list-box::-webkit-scrollbar { width: 4px; }
.sources-list-box::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 2px; }

.source-item {
  padding: 16px 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: 0.2s;
  display: flex; justify-content: space-between; align-items: center; outline: none; position: relative;
}
.source-item:focus-visible { background: rgba(0,176,255,0.08); box-shadow: inset 0 0 0 2px var(--accent2); border-bottom-color: transparent; }
.source-item.now-playing { background: linear-gradient(90deg, #1f2937 0%, var(--accent) 40%, var(--accent) 100%); color: #fff; border-bottom-color: transparent; }
.source-item.now-playing:focus-visible { box-shadow: inset 0 0 0 2px var(--accent2); }
.source-info-title { font-size: 0.95rem; font-weight: 700; color: inherit; margin-bottom: 4px; }
.source-info-sub { font-size: 0.75rem; color: var(--text-sub); }
.source-item.now-playing .source-info-sub { color: rgba(255,255,255,0.8); }
.source-badge { font-size: 0.65rem; background: rgba(255,255,255,0.1); padding: 4px 8px; border-radius: 6px; color: var(--text-sub); font-weight: 700; }
.source-item.now-playing .source-badge { background: rgba(0,0,0,0.5); color: var(--gold); }

/* ══════ PANTALLA COMPLETA ══════ */
body.fullscreen-active .main-area,
body.fullscreen-active .logo-footer,
body.fullscreen-active .sources-modal { display: none !important; }
body.fullscreen-active .player-col { position: fixed; inset: 0; width: 100%; height: 100%; padding: 0; z-index: 100; justify-content: flex-start; background: #000; }
body.fullscreen-active .player-container { border-radius: 0; width: 100%; height: 100%; aspect-ratio: auto; max-height: none; flex: 1; box-shadow: none; }
body.fullscreen-active .player-status { display: none; }
body.fullscreen-active .player-container:focus-visible { box-shadow: none !important; }

@media (max-width: 640px) {
  :root { --tv-player-w: 100vw; }
  .main-area { right: 0; bottom: 42vh; }
  .player-col { top: auto; bottom: 0; height: 42vh; padding: 8px; padding-bottom: 8px; justify-content: flex-start; background: var(--bg); border-top: 1px solid var(--border); }
  .sources-modal { right: 0; bottom: 42vh; }
  
  .detail-content { padding-bottom: 20px; }
  .detail-logo { max-height: 80px; }
  .detail-desc { font-size: 0.85rem; margin-bottom: 16px; }
}
</style>
</head>
<body>

<!-- ══════ BARRA SUPERIOR ══════ -->
<div class="logo-footer">
  <div class="top-actions">
    <button class="action-btn primary" onclick="init()">Cargar</button>
    <button class="action-btn proxy on" id="proxyToggle" onclick="toggleProxy()">Proxy: ON</button>
  </div>
</div>

<!-- ══════ ÁREA IZQUIERDA ══════ -->
<div class="main-area">
  <div id="catalogView" style="display:flex; flex-direction:column; height:100%;">
    <div class="categories-bar" id="categoriesBar"></div>
    <div class="poster-grid" id="posterGrid">
      <div class="empty-msg" style="grid-column: 1/-1; text-align:center; color:var(--text-sub); padding-top:50px;">
        Pulsa <b>Cargar</b> para empezar
      </div>
    </div>
  </div>

  <!-- VISTA DE DETALLES -->
  <div id="detailView">
    <div class="detail-content">
      <img id="detLogo" class="detail-logo" src="" alt="" style="display:none;">
      <h1 class="detail-title" id="detTitle" style="display:none;">Título</h1>
      
      <div class="detail-meta" id="detMeta1"></div>
      <div class="detail-meta" id="detMeta2" style="margin-top:-4px; margin-bottom: 16px;"></div>
      
      <p class="detail-desc" id="detDesc">Descripción de la película...</p>
      
      <button class="btn-play-large" id="btnPlayMain" onclick="openSources()">▶ Reproducir</button>
    </div>
  </div>
</div>

<!-- ══════ REPRODUCTOR ══════ -->
<div class="player-col">
  <div class="player-container" id="simulatedPlayer" tabindex="0" role="button" aria-label="Reproductor">
    <div class="player-overlay" id="playerOverlay"></div>
    <div class="player-content" id="playerContent">
      <div class="player-msg" id="playerMsg">Selecciona una película o serie</div>
    </div>
    
    <!-- AGREGADO: EL REPRODUCTOR DE VIDEO REAL (Oculto al inicio) -->
    <video id="iptv-player" playsinline controls></video>
  </div>
  <div class="player-status">
    <span id="currentCatName">Esperando...</span>
    <span id="status">Listo</span>
  </div>
</div>

<!-- ══════ MODAL DE FUENTES ══════ -->
<div class="sources-modal" id="sourcesModal">
  <div class="sources-pills">
    <button class="source-pill active">LaMovie</button>
  </div>
  <div class="sources-list-box" id="sourcesList"></div>
</div>

<script>
const CATALOG_ADDON = 'https://catalog.nuvio.tv/%7B%22language%22%3A%22es-MX%22%2C%22region%22%3A%22CO%22%7D';
const PROXY = 'https://api.allorigins.win/raw?url=';
let useProxy = true;
let currentMeta = null;
let hlsInst = null; // Variable global para HLS

function toggleProxy() {
  useProxy = !useProxy;
  const btn = document.getElementById('proxyToggle');
  btn.textContent = 'Proxy: ' + (useProxy ? 'ON' : 'OFF');
  btn.classList.toggle('on', useProxy);
}

function fetchUrl(url) { return useProxy ? PROXY + encodeURIComponent(url) : url; }
function setStatus(msg, type = '') {
  const el = document.getElementById('status');
  if (el) { el.innerHTML = msg; el.className = type; }
}
function escapeHtml(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, m => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[m]));
}

/* ══════ CARGA DEL CATÁLOGO ══════ */
async function init() {
  setStatus('<span class="loader"></span> Cargando...');
  document.getElementById('categoriesBar').innerHTML = '';
  document.getElementById('posterGrid').innerHTML = '<div style="grid-column:1/-1; text-align:center; padding-top:20px; color:var(--text-sub);">Cargando...</div>';
  closeDetails();

  try {
    const r = await fetch(fetchUrl(CATALOG_ADDON + '/manifest.json'));
    const manifestData = await r.json();
    setStatus('✅ OK', 'ok');
    renderCategories(manifestData);
  } catch (e) {
    setStatus('❌ Error', 'error');
    document.getElementById('posterGrid').innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--red);">Error de red</div>';
  }
}

function renderCategories(manifestData) {
  const bar = document.getElementById('categoriesBar');
  bar.innerHTML = '';
  const cats = (manifestData.catalogs || []).slice().sort((a, b) => a.type === b.type ? 0 : (a.type === 'movie' ? -1 : 1));

  cats.forEach((cat, i) => {
    const btn = document.createElement('button');
    btn.className = 'category-btn' + (i === 0 ? ' active' : '');
    btn.textContent = (cat.type === 'series' ? '📺 ' : '🎬 ') + cat.name;
    btn.onclick = () => {
      bar.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      loadCatalog(cat);
    };
    bar.appendChild(btn);
  });
  if (cats.length) loadCatalog(cats[0]);
}

async function loadCatalog(cat) {
  document.getElementById('currentCatName').textContent = cat.name;
  const grid = document.getElementById('posterGrid');
  grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; padding:20px;"><span class="loader"></span></div>';
  
  try {
    const r = await fetch(fetchUrl(`${CATALOG_ADDON}/catalog/${cat.type}/${cat.id}.json`));
    const data = await r.json();
    const metas = Array.isArray(data.metas) ? data.metas : [];
    setStatus(`✅ ${metas.length}`, 'ok');

    grid.innerHTML = '';
    metas.forEach(meta => {
      const card = document.createElement('div');
      card.className = 'poster-card';
      card.tabIndex = 0;
      card.innerHTML = `<img src="${escapeHtml(meta.poster || '')}" loading="lazy"><div class="name">${escapeHtml(meta.name)}</div>`;
      
      card.onclick = () => showDetails(meta, card);
      card.onkeydown = (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showDetails(meta, card); }
      };
      grid.appendChild(card);
    });
  } catch (e) {
    setStatus('❌ Error', 'error');
    grid.innerHTML = '<div style="grid-column:1/-1; text-align:center; color:var(--red);">Error al cargar</div>';
  }
}

/* ══════ VISTA DE DETALLES ══════ */
function showDetails(meta, posterElement) {
  currentMeta = meta;
  
  document.querySelectorAll('.poster-card').forEach(el => el.classList.remove('now-playing'));
  if (posterElement) posterElement.classList.add('now-playing');

  document.getElementById('catalogView').style.display = 'none';
  const detView = document.getElementById('detailView');
  detView.style.display = 'flex';
  detView.scrollTop = 0;

  const logoEl = document.getElementById('detLogo');
  const titleEl = document.getElementById('detTitle');
  
  if (meta.logo && meta.logo.startsWith('http')) {
    logoEl.src = meta.logo;
    logoEl.style.display = 'block';
    titleEl.style.display = 'none';
    logoEl.onerror = () => {
      logoEl.style.display = 'none';
      titleEl.textContent = meta.name;
      titleEl.style.display = 'block';
    };
  } else {
    titleEl.textContent = meta.name;
    titleEl.style.display = 'block';
    logoEl.style.display = 'none';
  }

  const typeStr = meta.type === 'series' ? 'Serie' : 'Película';
  const genresStr = (meta.genres && meta.genres.length) ? meta.genres.join(' • ') : '';
  const yearStr = meta.releaseInfo || '';
  
  let meta1Html = `<span>${typeStr}</span>`;
  if (genresStr) meta1Html += `<span class="dot">•</span><span>${escapeHtml(genresStr)}</span>`;
  if (yearStr) meta1Html += `<span class="dot">•</span><span>${escapeHtml(yearStr)}</span>`;
  document.getElementById('detMeta1').innerHTML = meta1Html;

  const runtimeStr = meta.runtime ? meta.runtime : ''; 
  const imdbStr = meta.imdbRating ? `<span class="imdb-badge">IMDb</span> <span>${escapeHtml(meta.imdbRating)}</span>` : '';
  
  let meta2Html = '';
  if (runtimeStr) meta2Html += `<span>${escapeHtml(runtimeStr)}</span>`;
  if (runtimeStr && imdbStr) meta2Html += `<span class="dot">•</span>`;
  if (imdbStr) meta2Html += imdbStr;
  
  const elMeta2 = document.getElementById('detMeta2');
  if (meta2Html) {
    elMeta2.innerHTML = meta2Html;
    elMeta2.style.display = 'flex';
  } else {
    elMeta2.style.display = 'none';
  }

  document.getElementById('detDesc').textContent = meta.description || 'Sin descripción disponible.';
  
  const bg = meta.background || meta.poster;
  detView.style.backgroundImage = `url('${bg}')`;
  
  setTimeout(() => document.getElementById('btnPlayMain').focus(), 100);
}

function closeDetails() {
  document.getElementById('detailView').style.display = 'none';
  document.getElementById('catalogView').style.display = 'flex';
  const playingCard = document.querySelector('.poster-card.now-playing');
  if (playingCard) playingCard.focus();
}

/* ══════ EL MOTOR DE BÚSQUEDA (ADDON LATAM - LAMOVIE) ══════ */
async function buscarEmbedsReales(meta) {
  return new Promise(async (resolve) => {
    try {
      const urlPlugin = 'https://raw.githubusercontent.com/Droydr13/pluggin-latino/main/providers/lamovie.js';
      const r = await fetch(urlPlugin);
      const codigoJS = await r.text();

      const iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      document.body.appendChild(iframe);

      const listener = (event) => {
        if (event.data && event.data.type === 'EMBED_ENCONTRADO') {
          window.removeEventListener('message', listener);
          if (document.body.contains(iframe)) document.body.removeChild(iframe);
          resolve(event.data.links);
        }
      };
      window.addEventListener('message', listener);

      const script = `
        ${codigoJS}
        (async () => {
          try {
            const resultado = await getStreams("${meta.id}", "${meta.type}", null, null);
            if (resultado && resultado.length > 0) {
              window.parent.postMessage({ type: 'EMBED_ENCONTRADO', links: resultado }, '*');
            } else {
              window.parent.postMessage({ type: 'EMBED_ENCONTRADO', links: [] }, '*');
            }
          } catch (e) {
            window.parent.postMessage({ type: 'EMBED_ENCONTRADO', links: [] }, '*');
          }
        })();
      `;

      const doc = iframe.contentWindow.document;
      doc.open();
      doc.write('<script>' + script + '<\/script>');
      doc.close();

      setTimeout(() => {
        window.removeEventListener('message', listener);
        if (document.body.contains(iframe)) document.body.removeChild(iframe);
        resolve([]);
      }, 15000);

    } catch (e) {
      resolve([]);
    }
  });
}

/* ══════ MODAL DE FUENTES ══════ */
async function openSources() {
  if (!currentMeta) return;
  
  const listContainer = document.getElementById('sourcesList');
  listContainer.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-sub);"><div class="loader"></div> Buscando en LaMovie...</div>';
  document.getElementById('sourcesModal').classList.add('open');

  const linksReales = await buscarEmbedsReales(currentMeta);

  listContainer.innerHTML = '';

  if (linksReales.length === 0) {
    listContainer.innerHTML = '<div style="padding:20px;text-align:center;color:var(--red);">No se encontraron enlaces.<br><small>(En el navegador falla por CORS, en Capacitor funcionará).</small></div>';
    return;
  }

  linksReales.forEach((p) => {
    const div = document.createElement('div');
    div.className = 'source-item';
    div.tabIndex = 0;
    
    const title = p.title || p.name || 'Reproductor';
    const quality = p.quality || 'Auto';

    div.innerHTML = `
      <div>
        <div class="source-info-title">${escapeHtml(title)}</div>
        <div class="source-info-sub">Calidad: ${quality}</div>
      </div>
      <div class="source-badge">LaMovie</div>
    `;
    
    div.onclick = () => playSource(p, div);
    div.onkeydown = (e) => {
      if (e.key === 'ArrowRight') { e.preventDefault(); document.getElementById('simulatedPlayer').focus(); }
      else if (e.key === 'ArrowLeft') { e.preventDefault(); closeSources(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); playSource(p, div); }
      else if (e.key === 'ArrowDown') { e.preventDefault(); div.nextElementSibling?.focus(); }
      else if (e.key === 'ArrowUp') { e.preventDefault(); div.previousElementSibling?.focus(); }
    };
    listContainer.appendChild(div);
  });

  setTimeout(() => {
    const first = document.querySelector('.source-item');
    if (first) first.focus();
  }, 100);
}

function closeSources() {
  document.getElementById('sourcesModal').classList.remove('open');
  setTimeout(() => document.getElementById('btnPlayMain').focus(), 50);
}

/* ══════ REPRODUCIR Y CAPTURAR ══════ */
function playSource(provider, element) {
  document.querySelectorAll('.source-item').forEach(el => el.classList.remove('now-playing'));
  element.classList.add('now-playing');
  
  const playerEl = document.getElementById('simulatedPlayer');
  const msgEl    = document.getElementById('playerMsg');
  
  if (playerEl && currentMeta) {
    const poster = currentMeta.poster ? `url('${currentMeta.poster}')` : 'none';
    playerEl.style.background = `linear-gradient(rgba(0,0,0,0.55), rgba(0,0,0,0.85)), ${poster} center/cover no-repeat, #000`;
  }

  if (msgEl) {
    msgEl.classList.add('sim-playing');
    msgEl.innerHTML = `
      <span class="sim-title">Buscando video...</span>
      <span class="sim-sub">Extrayendo .m3u8 del embed</span>
    `;
  }
  
  // AQUÍ INICIAMOS LA CAPTURA NATIVA (Como en tu index.html)
  if (typeof window.SSNative !== 'undefined' && window.SSNative.capture) {
    window.SSNative.capture(true); // Encendemos el capturador de Android
    console.log("Capturador encendido, esperando .m3u8 de:", provider.url);
    
    // Abrimos el embed en un iframe invisible para que el capturador lo analice
    let embedWrapper = document.getElementById('embedWrapper');
    if (!embedWrapper) {
      embedWrapper = document.createElement('div');
      embedWrapper.id = 'embedWrapper';
      embedWrapper.style.cssText = 'position:absolute; inset:0; z-index:-1; opacity:0.01; pointer-events:none;';
      playerEl.appendChild(embedWrapper);
    }
    
    embedWrapper.innerHTML = `<iframe src="${provider.url}" style="width:100%; height:100%; border:none;" allow="autoplay; encrypted-media"></iframe>`;
    
    // Guardamos que estamos esperando este embed
    window._embedWaiting = true;
    setStatus('Capturando...', 'ok');
  } else {
    alert("No se encontró window.SSNative. Esto solo funciona en la app de Capacitor.\n\nURL del embed:\n" + provider.url);
  }
}

/* ══════ FUNCIÓN NATIVA QUE ANDROID LLAMA AL ATRAPAR EL M3U8 ══════ */
window.onM3u8Intercepted = function(m3u8Url, referer) {
  console.log('[NuvioApp] ¡Capturado!', m3u8Url, '| Referer:', referer);
  
  if (!window._embedWaiting) return; // Si no estamos esperando, ignorar
  window._embedWaiting = false;

  // Apagamos el capturador y limpiamos el iframe
  if (typeof window.SSNative !== 'undefined' && window.SSNative.capture) window.SSNative.capture(false);
  const embedWrapper = document.getElementById('embedWrapper');
  if (embedWrapper) embedWrapper.remove();

  // Ocultamos el mensaje y mostramos el video
  const msgEl = document.getElementById('playerMsg');
  if (msgEl) msgEl.style.display = 'none';
  
  const video = document.getElementById('iptv-player');
  video.style.display = 'block';

  if (hlsInst) { hlsInst.destroy(); hlsInst = null; }

  if (Hls.isSupported()) {
    hlsInst = new Hls({
      enableWorker: true,
      backBufferLength: 30,
      maxBufferLength: 45,
      fragLoadingMaxRetry: 8,
      manifestLoadingMaxRetry: 6
    });

    hlsInst.loadSource(m3u8Url);
    hlsInst.attachMedia(video);
    
    hlsInst.on(Hls.Events.MANIFEST_PARSED, () => {
      video.play().catch(e => console.warn('Autoplay bloqueado', e));
      setStatus('Reproduciendo', 'ok');
    });
  } else {
    video.src = m3u8Url;
    video.play();
    setStatus('Reproduciendo (nativo)', 'ok');
  }
};

/* ══════ PANTALLA COMPLETA ══════ */
function enterFullscreen() {
  const el = document.getElementById('simulatedPlayer');
  if (el.requestFullscreen) { el.requestFullscreen().catch(err => console.warn(err)); }
  document.body.classList.add('fullscreen-active');
}

function exitFullscreen() {
  if (document.exitFullscreen && document.fullscreenElement) { document.exitFullscreen(); }
  document.body.classList.remove('fullscreen-active');
  restoreFocusAfterFullscreen();
}

function restoreFocusAfterFullscreen() {
  if (document.getElementById('sourcesModal').classList.contains('open')) {
    const playingSrc = document.querySelector('.source-item.now-playing');
    if (playingSrc) { playingSrc.focus(); playingSrc.scrollIntoView({ block: 'nearest' }); }
    else document.querySelector('.source-item')?.focus();
  }
}

document.addEventListener('fullscreenchange', () => {
  if (!document.fullscreenElement) { document.body.classList.remove('fullscreen-active'); restoreFocusAfterFullscreen(); }
});

const simPlayer = document.getElementById('simulatedPlayer');
simPlayer.addEventListener('click', (e) => {
  // Si se hace clic en el video, no hacer pantalla completa si el control es nativo
  if(e.target.tagName !== 'VIDEO') {
    enterFullscreen();
  }
});
simPlayer.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); enterFullscreen(); }
  else if (e.key === 'ArrowLeft') {
    e.preventDefault();
    if (document.getElementById('sourcesModal').classList.contains('open')) {
      const playingSrc = document.querySelector('.source-item.now-playing');
      if (playingSrc) playingSrc.focus();
    }
  }
});

/* ══════ LÓGICA DE RETROCESO ══════ */
function handleBackAction() {
  if (document.body.classList.contains('fullscreen-active')) {
    exitFullscreen();
    return;
  }
  if (document.getElementById('sourcesModal').classList.contains('open')) {
    closeSources();
    return;
  }
  if (document.getElementById('detailView').style.display === 'flex') {
    closeDetails();
    return;
  }
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' || e.key === 'Backspace') {
    e.preventDefault();
    handleBackAction();
  }
});

history.pushState({ page: 1 }, '', '');
window.addEventListener('popstate', () => {
  history.pushState({ page: 1 }, '', '');
  handleBackAction();
});

window.addEventListener('DOMContentLoaded', init);
</script>
