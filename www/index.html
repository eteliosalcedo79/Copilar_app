<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CineHax TV</title>
<style>
  :root{
    --bg:#0d1117; --sidebar:#161b22; --card:#1b2230; --text:#e6edf3;
    --muted:#8b949e; --accent:#e50914; --border:#30363d;
  }
  *{box-sizing:border-box; outline:none;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    width:100vw; height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }

  /* --- CONTENIDO PRINCIPAL --- */
  main {
    flex: 1; min-height: 0; padding: 4vh 3vw; overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

  .section { margin-bottom: 4vh; }
  .section h2 { font-size: 1.8vw; margin: 0 0 1.5vh 0; font-weight: 600; text-transform: uppercase; }

  /* Filas Horizontales */
  .carousel {
    display: flex; gap: 1.5vw; overflow-x: auto;
    padding: 2vh 1vw 3vh 1vw;
    scroll-behavior: smooth; scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }

  /* TARJETAS */
  .card {
    flex: 0 0 12vw; background: var(--card); border-radius: 10px; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
    border: 3px solid transparent; display: flex; flex-direction: column; cursor: pointer;
  }

  .card:focus {
    transform: scale(1.05); border-color: var(--accent);
    box-shadow: 0 10px 20px rgba(229,9,20,0.4); z-index: 10; position: relative;
  }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #222; }
  .card.chan { flex: 0 0 22vw; width: 22vw; height: 12.4vw; position: relative; background: var(--card); }
  .card.chan img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; margin: 0; padding: 0; object-fit: cover; object-position: center center; background: transparent; display: block; }
  .card.chan .meta { position: absolute; left: 0; right: 0; bottom: 0; padding: 1.2vh 1vw; z-index: 2; }
  .card.chan .title { font-size: 1.35vw; text-transform: uppercase; color: #fff; letter-spacing: .5px;
    text-shadow: -1px -1px 0 #000, 1px -1px 0 #000, -1px 1px 0 #000, 1px 1px 0 #000, 0 2px 6px rgba(0,0,0,.9); }
  .tag { position: absolute; top: 1.2vh; left: .9vw; z-index: 3; padding: .5vh .9vw; border-radius: 8px; color: #fff;
    font-size: 1vw; font-weight: 800; letter-spacing: 1px; line-height: 1.2; text-transform: uppercase; }
  .tag.flv { background: #f57c00; }
  .tag.directo { background: #0a9e3c; }
  .card .meta { padding: 1.5vh 1vw; display: flex; align-items: center; }

  .card .title {
    font-size: 1.2vw; font-weight: bold; line-height: 1.2; width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  /* MODAL (confirmar salida) */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.open { display: flex; }
  
  .modal-inner { 
    position: relative; background: var(--sidebar); border-radius: 16px; 
    padding: 5vh 4vw; max-width: 70vw; width: 100%; text-align: center; 
    border: 2px solid var(--accent); /* Borde rojo */
    max-height: 92vh; overflow-y: auto; 
  }
  
  .warning-icon {
    font-size: 5vw; margin-bottom: 2vh; color: #f1c40f; /* Triángulo amarillo */
  }
  
  .modal-inner h3 { 
    font-size: 2.5vw; margin: 0 0 2vh 0; color: var(--accent); /* Título rojo */
  }
  
  .modal-desc {
    font-size: 1.5vw; color: var(--muted); margin: 0 0 4vh 0;
  }
  
  .modal-actions {
    display: flex; justify-content: center; gap: 2vw;
  }
  
  .modal-actions button {
    padding: 1.5vh 3vw; font-size: 1.3vw; border-radius: 8px; 
    font-weight: bold; cursor: pointer; transition: all 0.2s; 
    border: 2px solid transparent;
  }
  
  .btn-cancel {
    background: transparent; color: #fff; border: 2px solid var(--border);
  }
  .btn-cancel:focus {
    border-color: var(--accent); box-shadow: 0 0 12px rgba(229,9,20,0.5); 
    transform: scale(1.05); outline: none;
  }
  
  .btn-exit {
    background: var(--accent); color: #fff; border: 2px solid var(--accent);
  }
  .btn-exit:focus {
    box-shadow: 0 0 15px var(--accent); transform: scale(1.05); outline: none;
  }

  /* INICIO DE SESIÓN */
  #login { position: fixed; inset: 0; z-index: 300; display: none; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 30%, var(--card) 0%, var(--bg) 70%); }
  #login.open { display: flex; }
  .login-card { width: min(520px, 80vw); display: flex; flex-direction: column; gap: 2vh; padding: 5vh 4vw;
    background: var(--sidebar); border: 1px solid var(--border); border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.6); }
  .login-card h2 { margin: 0 0 1vh; text-align: center; font-size: clamp(1.3rem, 2.2vw, 1.8rem); color: var(--accent); }
  .login-card input { background: var(--card); color: var(--text); border: 2px solid var(--border); border-radius: 8px;
    padding: 2vh 1.5vw; font-size: clamp(1rem, 1.6vw, 1.3rem); }
  .login-card input:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(229,9,20,.45); }
  .login-card button { background: var(--accent); color: #fff; border: 2px solid var(--accent); border-radius: 8px; padding: 2vh 1.5vw;
    font-size: clamp(1rem, 1.5vw, 1.2rem); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; cursor: pointer; }
  .login-card button:focus { border-color: #fff; box-shadow: 0 0 18px rgba(229,9,20,.7); }
  #lg-msg { min-height: 1.4em; text-align: center; color: #ffb3b8; font-size: clamp(.85rem, 1.2vw, 1.05rem); }

  /* REPRODUCTOR */
  #player { position: fixed; inset: 0; background: #000 url('fondo_reproductor.webp') center center / cover no-repeat; z-index: 200; display: none; flex-direction: column; }
  #player.open { display: flex; }
  #player-bar { display: none; }
  #player video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; background: transparent; }
  #player-msg { position: absolute; left: 0; right: 0; top: 78%; text-align: center; font-size: 1.8vw; color: #fff; padding: 2vh 3vw; pointer-events: none; }

  /* BARRA DEL REPRODUCTOR */
  #pbar { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15; display: flex; flex-direction: column; gap: 6px;
    padding: 14px 4vw 12px; background: linear-gradient(to top, rgba(0,0,0,.92) 0%, rgba(0,0,0,.55) 70%, transparent 100%);
    opacity: 0; pointer-events: none; transform: translateY(8px); transition: opacity .22s ease, transform .22s ease; }
  #pbar.visible { opacity: 1; pointer-events: auto; transform: none; }
  .pb-row { display: flex; align-items: center; gap: clamp(10px, 2vw, 22px); }
  .pb-btn { position: relative; display: flex; align-items: center; justify-content: center; min-width: 44px; min-height: 44px; padding: 6px;
    border: 2px solid transparent; border-radius: 10px; color: #fff; cursor: pointer; font-weight: 900; font-size: .85rem; letter-spacing: .8px; }
  .pb-btn svg { width: 22px; height: 22px; display: block; }
  .pb-btn.focused { border-color: var(--accent); background: rgba(229,9,20,.22); box-shadow: 0 0 0 3px rgba(229,9,20,.3); }
  .pb-live { margin-left: auto; display: flex; align-items: center; gap: 7px; font-size: .75rem; font-weight: 800; letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; user-select: none; }
  .pb-dot { width: 9px; height: 9px; border-radius: 50%; background: #ff1744; box-shadow: 0 0 8px rgba(255,23,68,.7); animation: pbPulse 1.4s ease-in-out infinite; }
  .pb-live.vod .pb-dot { background: #fff; box-shadow: none; animation: none; }
  @keyframes pbPulse { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: .55; transform: scale(.85); } }
  .pb-progress { display: none; align-items: center; gap: 12px; width: 100%; box-sizing: border-box; padding: 0 clamp(10px, 2vw, 20px); margin-bottom: 4px; }
  .pb-time { width: 52px; text-align: center; font-size: .95rem; font-weight: 700; color: rgba(255,255,255,.7); white-space: nowrap; }
  .pb-track { flex: 1; height: 8px; position: relative; background: rgba(255,255,255,.15); border: 2px solid transparent; border-radius: 4px; cursor: pointer; transition: all .2s ease; }
  .pb-fill { position: absolute; left: 0; top: 0; height: 100%; width: 0; background: var(--accent); border-radius: 4px; }
  .pb-thumb { position: absolute; top: 50%; left: 0; width: 16px; height: 16px; border-radius: 50%; background: #fff; pointer-events: none; z-index: 2;
    transform: translate(-50%, -50%) scale(0); transition: transform .15s ease; box-shadow: 0 2px 6px rgba(0,0,0,.8); }
  .pb-track.focused { background: rgba(255,255,255,.25); border-color: var(--accent); box-shadow: 0 0 12px rgba(229,9,20,.5); transform: scaleY(1.2); margin: 0 8px; }
  .pb-track.focused .pb-thumb { transform: translate(-50%, -50%) scale(1); box-shadow: 0 0 10px #fff, 0 2px 8px rgba(0,0,0,.8); }
  .pb-progress.on-focus .pb-time { color: #fff; }
  #pb-qmenu { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); margin-bottom: 10px; display: none; flex-direction: column; gap: 2px;
    min-width: 150px; padding: 6px; background: rgba(15,19,25,.97); border: 2px solid var(--accent); border-radius: 12px; z-index: 100; box-shadow: 0 6px 32px rgba(0,0,0,.8); }
  #pb-qmenu.open { display: flex; }
  .pb-qitem { padding: 9px 16px; border: 1px solid transparent; border-radius: 7px; text-align: center; white-space: nowrap; font-size: .9rem; font-weight: 700; color: #fff; cursor: pointer; }
  .pb-qitem.act { color: var(--accent); font-weight: 900; }
  .pb-qitem.act::before { content: '✓  '; }
  .pb-qitem.only::before { content: none; }
  .pb-qitem.focused { background: rgba(229,9,20,.25); border-color: var(--accent); transform: scale(1.05); }
  #pb-toast { position: absolute; top: 9vh; right: 3vw; z-index: 16; padding: 8px 16px; border-radius: 8px; background: rgba(0,0,0,.75); color: #fff; font-size: 1rem; font-weight: 700; opacity: 0; transition: opacity .2s; pointer-events: none; }
  #pb-toast.show { opacity: 1; }

  .error { background: #3d1114; border: 1px solid #7a1c20; color: #ffb3b8; padding: 2vh; border-radius: 8px; font-size: 1.5vw; margin: 2vh 0; }
  .loader { text-align: center; padding: 10vh; color: var(--muted); font-size: 2vw; }
</style>
</head>
<body>

<main id="app">
  <div class="loader" id="boot-msg">Cargando...</div>
</main>

<!-- NUEVO MODAL ESTÁTICO -->
<div class="modal" id="modal">
  <div class="modal-inner" id="modal-inner" tabindex="-1">
    <div class="warning-icon">⚠️</div>
    <h3>¡Confirmar salida!</h3>
    <p class="modal-desc">¿Realmente quieres salir de la aplicación?</p>
    <div class="modal-actions">
      <button id="modal-cancel" class="btn-cancel">CANCELAR</button>
      <button id="modal-exit" class="btn-exit">SALIR</button>
    </div>
  </div>
</div>

<div id="login">
  <div class="login-card">
    <h2>Iniciar sesión</h2>
    <input id="lg-user" type="text" placeholder="Usuario" autocomplete="off" autocapitalize="off" spellcheck="false" tabindex="0">
    <input id="lg-pass" type="password" placeholder="Contraseña" autocomplete="off" tabindex="0">
    <div id="lg-msg"></div>
    <button id="lg-btn" type="button" tabindex="0">Entrar</button>
  </div>
</div>

<div id="player">
  <div id="player-bar"></div>
  <video id="player-video" autoplay playsinline tabindex="0" poster="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7"></video>
  <div id="player-msg"></div>
</div>

<!-- HLS y FLV locales: hls.min.js y mpegts.min.js van en la misma carpeta que este index.html -->
<script src="hls.min.js"></script>
<script src="mpegts.min.js"></script>

<script>
(() => {
  const RAW_BASE = 'https://raw.githubusercontent.com/iptv-tec/Contenido/main/';

  const ARCHIVOS = [
    { clave: 'version', archivo: 'canales.json', cache: 'ph_cache_canales', nombre: 'canales' }
  ];

  const app = document.getElementById('app');
  const modal = document.getElementById('modal');
  const mInner = document.getElementById('modal-inner');
  const playerEl = document.getElementById('player');
  const playerBar = document.getElementById('player-bar');
  const playerMsg = document.getElementById('player-msg');
  const video = document.getElementById('player-video');

  let canales = null;

  // ---------- Utilidades ----------
  function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // ---------- Caché local + descarga por versión ----------
  const MEM = {};
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };

  function setBoot(msg) {
    const el = document.getElementById('boot-msg');
    if (el) el.textContent = msg;
  }

  async function fetchRaw(file, ms) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 8000);
    try {
      const r = await fetch(RAW_BASE + file + '?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + file);
      return await r.text();
    } finally { clearTimeout(t); }
  }

  function cargarDesdeCache() {
    const a = ARCHIVOS[0];
    try { canales = JSON.parse(MEM[a.cache] || LS.get(a.cache) || 'null'); } catch (e) { canales = null; }
    return !!canales;
  }

  async function revisarActualizaciones() {
    let remota = null;
    try { remota = JSON.parse(await fetchRaw('version.json', 6000)); } catch (e) { console.warn('version.json no disponible', e); }
    let locales = {};
    try { locales = JSON.parse(LS.get('ph_versiones') || '{}'); } catch (e) { locales = {}; }
    const actualizados = [];
    for (const a of ARCHIVOS) {
      const guardado = MEM[a.cache] || LS.get(a.cache);
      const hayRemota = remota && remota[a.clave] !== undefined;
      const cambio = hayRemota && remota[a.clave] !== locales[a.clave];
      if (guardado && !cambio) continue;
      if (!remota && guardado) continue;
      setBoot('Descargando ' + a.nombre + '...');
      try {
        const txt = await fetchRaw(a.archivo, 15000);
        MEM[a.cache] = txt;
        if (LS.set(a.cache, txt) && hayRemota) locales[a.clave] = remota[a.clave];
        actualizados.push(a.cache);
      } catch (e) { console.warn('No se pudo descargar ' + a.archivo, e); }
    }
    LS.set('ph_versiones', JSON.stringify(locales));
    return actualizados;
  }

  // ---------- Canales ----------
  function autoFocus() {
    setTimeout(() => {
      if (loginOpen()) return;
      const ae = document.activeElement;
      if (ae && ae !== document.body && document.body.contains(ae)) return;
      const first = app.querySelector('.card');
      if (first) first.focus();
    }, 100);
  }

  function tagCanal(c) {
    const u = (c.url || '').toLowerCase();
    if (u.includes('.flv')) return '<span class="tag flv">FLV</span>';
    if (u.includes('.m3u')) return '<span class="tag directo">DIRECTO</span>';
    return '';
  }

  function renderCanales(noFocus) {
    if (!canales || !canales.lista) {
      app.innerHTML = '<div class="error">No hay canales cargados. Revisa tu conexión y reabre la app.</div>';
      return;
    }
    const orden = (canales.orden || []).filter(c => canales.lista[c]);
    Object.keys(canales.lista).forEach(c => { if (!orden.includes(c)) orden.push(c); });
    let html = '';
    for (const cat of orden) {
      const lista = canales.lista[cat] || [];
      if (!lista.length) continue;
      html += `<div class="section"><h2>${escapeHtml(cat)}</h2><div class="carousel">` +
        lista.map((c, i) => `<div class="card chan" tabindex="0" data-cat="${escapeHtml(cat)}" data-idx="${i}">
          <img src="${escapeHtml(c.logo || '')}" onerror="this.style.opacity=.3" loading="lazy">
          ${tagCanal(c)}
          <div class="meta"><div class="title">${escapeHtml(c.nombre)}</div></div></div>`).join('') +
        `</div></div>`;
    }
    app.innerHTML = html || '<div class="loader">Sin canales</div>';
    app.querySelectorAll('.card.chan').forEach(el => {
      el.addEventListener('click', () => {
        const c = (canales.lista[el.getAttribute('data-cat')] || [])[parseInt(el.getAttribute('data-idx'), 10)];
        if (c) playChannel(c);
      });
      el.addEventListener('keydown', (e) => { if (e.key === 'Enter') el.click(); });
    });
    if (!noFocus) autoFocus();
  }

  // ---------- Reproductor ----------
  let hls = null, flv = null, lastFocus = null, pbar = null, playedOnce = false;

  function destroyPlayers() {
    if (hls) { hls.destroy(); hls = null; }
    if (flv) { flv.destroy(); flv = null; }
    video.pause(); video.removeAttribute('src'); video.load();
  }

  function restoreFocus(el) {
    if (el && document.body.contains(el)) rcFocus(el);
    else { const f = app.querySelector('.card'); if (f) rcFocus(f); }
  }

  function openPlayer(title) {
    lastFocus = document.activeElement;
    playedOnce = false;
    playerMsg.textContent = 'Cargando...';
    playerEl.classList.add('open');
    pbar.open(true);
    setTimeout(() => video.focus(), 100);
  }

  function stopPlayer() {
    pbar.close();
    destroyPlayers();
    playerEl.classList.remove('open');
    const t = lastFocus;
    setTimeout(() => restoreFocus(t), 100);
  }

  function playHls(url) {
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        pbar.updateQuality();
        video.play().catch(() => {});
      });
      hls.on(Hls.Events.LEVEL_SWITCHED, () => pbar.updateQuality());
      hls.on(Hls.Events.ERROR, (e, d) => {
        if (d && d.fatal) playerMsg.textContent = 'No se pudo reproducir este canal.';
      });
    } else {
      video.src = url;
      video.play().catch(() => {});
    }
  }

  video.addEventListener('playing', () => { playerMsg.textContent = ''; });

  // ---------- Barra del Reproductor ----------
  const SEEK_TAP = 10, SEEK_HOLD_SPS = 60, BAR_HIDE_MS = 4000;
  const ASPECTS = [{ key: 'contain', label: 'Ajustar' }, { key: 'cover', label: 'Recortar' }, { key: 'fill', label: 'Estirar' }];
  const ICO_PLAY = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
  const ICO_PAUSE = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>';
  const ICO_ASPECT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 9V5a2 2 0 0 0-2-2h-4M3 15v4a2 2 0 0 0 2 2h4M21 15v4a2 2 0 0 1-2 2h-4M3 9V5a2 2 0 0 1 2-2h4"/></svg>';

  class PlayerBar {
    constructor() {
      this.live = false; this.visible = false; this.menuOpen = false;
      this.btnIdx = 0; this.aspectIdx = 0; this.hideTimer = null; this.toastTimer = null;
      this.arrow = null; this.scrubPos = null; this.scrubRaf = null; this.items = []; this.itemIdx = 0;
      this.build();
    }
    build() {
      const mk = (tag, cls, html) => { const d = document.createElement(tag); if (cls) d.className = cls; if (html != null) d.innerHTML = html; return d; };
      const el = mk('div'); el.id = 'pbar';
      const prog = mk('div', 'pb-progress');
      const cur = mk('span', 'pb-time', '00:00');
      const track = mk('div', 'pb-track'), fill = mk('div', 'pb-fill'), thumb = mk('div', 'pb-thumb');
      track.appendChild(fill); track.appendChild(thumb);
      const tot = mk('span', 'pb-time', '00:00');
      prog.appendChild(cur); prog.appendChild(track); prog.appendChild(tot);
      const row = mk('div', 'pb-row');
      const bPlay = mk('div', 'pb-btn', ICO_PLAY), bAsp = mk('div', 'pb-btn', ICO_ASPECT), bQ = mk('div', 'pb-btn', '<span id="pb-qlbl">SD</span>');
      const menu = mk('div'); menu.id = 'pb-qmenu'; bQ.appendChild(menu);
      const live = mk('div', 'pb-live', '<span class="pb-dot"></span><span id="pb-livetxt">EN VIVO</span>');
      row.appendChild(bPlay); row.appendChild(bAsp); row.appendChild(bQ); row.appendChild(live);
      el.appendChild(prog); el.appendChild(row);
      const toast = mk('div'); toast.id = 'pb-toast';
      playerEl.appendChild(el); playerEl.appendChild(toast);
      Object.assign(this, { el, prog, cur, track, fill, thumb, tot, bPlay, bAsp, bQ, menuEl: menu, liveEl: live, toastEl: toast });
      this.btns = [bPlay, bAsp, bQ];
      this.btns.forEach((b, i) => b.addEventListener('click', () => { this.btnIdx = i; this.activate(i); this.resetTimer(); }));
      track.addEventListener('click', (e) => {
        if (!this.canSeek()) return;
        const r = track.getBoundingClientRect();
        video.currentTime = Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)) * video.duration;
        this.updateProgress(); this.resetTimer();
      });
      video.addEventListener('click', () => { if (this.visible) this.resetTimer(); else this.show(); });
      video.addEventListener('play', () => this.updatePlay());
      video.addEventListener('pause', () => this.updatePlay());
      video.addEventListener('timeupdate', () => { if (this.visible) this.updateProgress(); });
      video.addEventListener('durationchange', () => this.updateProgress());
      video.addEventListener('loadedmetadata', () => { this.updateProgress(); this.updateQuality(); });
      video.addEventListener('resize', () => this.updateQuality());
      document.addEventListener('click', (e) => {

  function sha256(ascii) {

    else if (k === 'ArrowUp') { e.preventDefault(); if (i > 0) items[i - 1].focus(); }
    else if (k === 'Enter') {
      if (ae === lgUser) { e.preventDefault(); lgPass.focus(); }
      else if (ae === lgPass) { e.preventDefault(); intentarLogin(); }
    } else if ((k === 'ArrowLeft' || k === 'ArrowRight') && ae === lgBtn) e.preventDefault();
  });
  document.addEventListener('focusin', (e) => { if (loginOpen() && !lgEl.contains(e.target)) lgUser.focus(); });

  (() => {
    let ses = null;
    try { ses = JSON.parse(LS.get('ph_sesion') || 'null'); } catch (e) { ses = null; }
    if (ses && ses.u && ses.k) {
      cargarUsuarios().then(lista => {
        if (!lista) return;
        const ent = buscarUsuario(lista, ses.u, ses.k);
        if (!ent) cerrarSesion();
        else { const m = motivoBloqueo(ent); if (m) cerrarSesion(m); }
      }).catch(() => {});
    } else abrirLogin();
  })();

  (async () => {
    let completo = false;
    try { completo = cargarDesdeCache(); } catch (e) { console.error(e); }
    if (!completo) {
      setBoot('Descargando canales...');
      try { await revisarActualizaciones(); } catch (e) { console.error(e); }
      try { cargarDesdeCache(); } catch (e) { console.error(e); }
    }
    renderCanales();

    if (completo) {
      revisarActualizaciones().then(act => {
        if (!act.includes(ARCHIVOS[0].cache)) return;
        try { canales = JSON.parse(MEM[ARCHIVOS[0].cache] || LS.get(ARCHIVOS[0].cache) || 'null'); } catch (e) { return; }
        if (playerEl.classList.contains('open') || modal.classList.contains('open') || loginOpen()) return;
        const act2 = document.activeElement;
        const cat = act2 && app.contains(act2) ? act2.getAttribute('data-cat') : null;
        const idx = act2 && app.contains(act2) ? act2.getAttribute('data-idx') : null;
        const top = app.scrollTop;
        renderCanales(true);
        app.scrollTop = top;
        if (cat !== null) {
          const el = Array.from(app.querySelectorAll('.card.chan')).find(c => c.getAttribute('data-cat') === cat && c.getAttribute('data-idx') === idx);
          if (el) el.focus({ preventScroll: true });
        } else autoFocus();
      }).catch(e => console.warn(e));
    }
  })();

})();
</script>
</body>
</html>
