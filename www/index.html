<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>CineHax TV</title>
<style>
  :root{
    --bg:#0d1117; --sidebar:#161b22; --card:#1b2230; --text:#e6edf3;
    --muted:#8b949e; --accent:#e50914; --border:#30363d; --bar-h:12vh;
    --modal-right: clamp(320px, 48vw, 720px);   /* franja libre a la derecha del modal de servidores (igual que la prueba) */
    --poster-w: 87px;                            /* ancho del póster en filas (igual que la prueba) */
  }
  *{box-sizing:border-box; outline:none;}
  html,body{
    margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:system-ui,Segoe UI,Roboto,sans-serif;
    width:100vw; height:100vh; overflow:hidden; display:flex; flex-direction:column;
  }

  /* --- BARRA SUPERIOR --- */
  #topbar { height: var(--bar-h); flex: none; display: flex; align-items: center; padding: 0 1vw;
    background: linear-gradient(180deg, #0b1a3a 0%, #0a1224 100%); border-bottom: 1px solid #1c2a4a; z-index: 60; }
  #main-nav { display: flex; width: 100%; gap: 1vw; }
  #main-nav button { flex: 1; display: flex; align-items: center; justify-content: center; gap: .7vw;
    background: transparent; color: #8da0c4; border: 3px solid transparent; border-radius: 14px; height: calc(var(--bar-h) * .72);
    font-size: 1.4vw; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; cursor: pointer; transition: all .2s; }
  #main-nav button svg { width: 1.8vw; height: 1.8vw; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  /* seleccionado: rojo */
  #main-nav button.active { background: var(--accent); color: #fff; }
  /* foco: borde rojo con brillo */
  #main-nav button:focus { background: var(--card); color: #fff; border-color: var(--accent); box-shadow: 0 0 15px rgba(229,9,20,.45); }
  /* seleccionado + foco: borde blanco para diferenciar */
  #main-nav button.active:focus { background: var(--accent); border-color: #fff; box-shadow: 0 0 18px rgba(255,255,255,.55); }

  /* --- CONTENIDO PRINCIPAL --- */
  main {
    flex: 1; min-height: 0; padding: 4vh 3vw; overflow-y: auto; overflow-x: hidden;
    scroll-behavior: smooth;
  }
  main::-webkit-scrollbar { width: 8px; }
  main::-webkit-scrollbar-thumb { background: #30363d; border-radius: 4px; }

  .section { margin-bottom: 4vh; }
  .section h2 { font-size: 1.8vw; margin: 0 0 1.5vh 0; font-weight: 600; }

  /* Filas Horizontales */
  .carousel {
    display: flex; gap: 1.5vw; overflow-x: auto;
    padding: 2vh 1vw 3vh 1vw;
    scroll-behavior: smooth; scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }

  /* Cuadrículas */
  .carousel.posters { gap: 8px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(85px, 1fr)); gap: 8px; padding: 8px; align-content: start; }
  .grid.genres { grid-template-columns: repeat(auto-fill, minmax(12vw, 1fr)); gap: 2vw; padding: 1vw; }

  /* TARJETAS */
  .card {
    flex: 0 0 12vw; background: var(--card); border-radius: 10px; overflow: hidden;
    transition: transform 0.2s, box-shadow 0.2s, border 0.2s;
    border: 3px solid transparent; display: flex; flex-direction: column; cursor: pointer;
  }
  /* Póster: tamaño de la prueba (87px en filas, minmax 85px en cuadrícula) */
  .card.poster { flex: 0 0 var(--poster-w); min-width: 0; border-width: 2px; border-radius: 8px; }
  .card.poster .meta { padding: 4px 2px; justify-content: center; }
  .card.poster .title { font-size: clamp(.6rem, .9vw, .72rem); font-weight: 600; text-align: center; line-height: 1.2; }
  .grid .card { flex: none; width: 100%; }

  .card:focus {
    transform: scale(1.05); border-color: var(--accent);
    box-shadow: 0 10px 20px rgba(229,9,20,0.4); z-index: 10; position: relative;
  }
  .card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; background: #222; }
  .card.chan { flex: 0 0 11vw; }
  .card.chan img { aspect-ratio: 1/1; object-fit: contain; background: #fff; padding: 6px; }
  .card .meta { padding: 1.5vh 1vw; display: flex; align-items: center; }

  .card .title {
    font-size: 1.2vw; font-weight: bold; line-height: 1.2; width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }

  .genre-card {
    display: flex; justify-content: center; align-items: center;
    padding: 3vh; font-size: 1.5vw; font-weight: bold; text-align: center;
  }

  /* BUSCADOR */
  .search-view { display: flex; flex-direction: column; gap: 2vh; margin-bottom: 3vh; margin-top: 2vh; }
  .search-box { display: flex; gap: 1vw; width: 100%; max-width: 800px; }
  .search-box input {
    flex: 1; background: var(--card); border: 2px solid var(--border);
    color: var(--text); padding: 2vh 1.5vw; border-radius: 8px; font-size: 1.5vw;
  }
  .search-box input:focus { border-color: var(--accent); }
  .search-box button {
    background: var(--accent); color: #fff; border: none; padding: 0 3vw;
    border-radius: 8px; font-size: 1.3vw; font-weight: bold; cursor: pointer;
  }
  .search-box button:focus { box-shadow: 0 0 15px var(--accent); transform: scale(1.05); }

  /* MODAL Y ESTADOS */
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 100; }
  .modal.open { display: flex; }
  .modal-inner { background: var(--sidebar); border-radius: 16px; padding: 4vh 4vw; max-width: 70vw; width: 100%; text-align: center; border: 2px solid var(--border); max-height: 92vh; overflow-y: auto; }
  .modal-inner h3 { font-size: 2.5vw; margin: 0 0 2vh 0; color: var(--accent); }
  .modal-inner p { font-size: 1.4vw; color: var(--text); margin: 0 0 2.5vh 0; line-height: 1.5; text-align: justify; max-height: 22vh; overflow-y: auto; }
  .modal-inner button { background: var(--accent); color: #fff; border: none; padding: 1.5vh 3vw; font-size: 1.5vw; border-radius: 8px; font-weight: bold; }
  .modal-inner button:focus { box-shadow: 0 0 15px var(--accent); transform: scale(1.05); }
  .modal-row { display: flex; gap: 1vw; flex-wrap: wrap; justify-content: center; margin-bottom: 2vh; }
  .modal-list { display: flex; flex-direction: column; gap: 1vh; align-items: stretch; max-height: 32vh; overflow-y: auto; margin-bottom: 2.5vh; padding: 0.5vh 0.5vw; }
  .modal-row:empty, .modal-list:empty { display: none; }
  .modal-inner button.opt { background: var(--card); border: 2px solid var(--border); padding: 1.2vh 1.5vw; font-size: 1.3vw; text-align: left; }
  .modal-inner button.opt.sel { border-color: #fff; }
  .modal-inner button.opt:focus { border-color: var(--accent); box-shadow: 0 0 12px rgba(229,9,20,0.5); transform: none; }

  /* MODAL DE SERVIDORES: tamaño y posición de la prueba (columna izquierda, deja libre --modal-right), rojo del index */
  .modal.srv { top: var(--bar-h); right: var(--modal-right); background: transparent; padding: clamp(16px, 3vh, 40px) 20px; }
  .modal.srv .modal-inner { width: 100%; max-width: 520px; height: 82%; max-height: 640px; padding: 0; display: flex; flex-direction: column; text-align: left; background: var(--sidebar); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; box-shadow: 0 8px 32px rgba(0,0,0,.6); }
  .modal.srv .modal-inner h3 { flex: 0 0 auto; margin: 0; padding: 16px 20px; border-bottom: 1px solid var(--border); background: var(--card); font-size: .82rem; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .modal.srv .modal-inner p { flex: 0 0 auto; margin: 0; padding: 12px 20px 0; font-size: .9rem; color: var(--muted); text-align: left; max-height: none; }
  .modal.srv .modal-list { flex: 1 1 auto; min-height: 0; max-height: none; margin: 0; padding: 10px; gap: 6px; scrollbar-width: thin; scrollbar-color: rgba(229,9,20,.35) transparent; }
  .modal.srv .modal-inner button.opt { flex: 0 0 auto; background: transparent; border: 2px solid transparent; border-radius: 10px; padding: 14px 16px; font-size: .95rem; font-weight: 700; }
  .modal.srv .modal-inner button.opt.sel { border-color: #fff; }
  .modal.srv .modal-inner button.opt:focus { border-color: var(--accent); box-shadow: none; color: #fff; }
  .modal.srv #modal-close { flex: 0 0 auto; margin: 8px 10px 10px; padding: 10px 16px; font-size: .95rem; }

  /* REPRODUCTOR */
  #player { position: fixed; inset: 0; background: #000; z-index: 200; display: none; flex-direction: column; }
  #player.open { display: flex; }
  #player-bar { padding: 1.2vh 2vw; font-size: 1.5vw; background: #111; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #player video { flex: 1; width: 100%; min-height: 0; background: #000; }
  #player-msg { position: absolute; left: 0; right: 0; top: 50%; text-align: center; font-size: 1.8vw; color: #fff; padding: 2vh 3vw; pointer-events: none; }


  /* DETALLE (pantalla propia, como la guía) */
  #detail { position: fixed; top: var(--bar-h); right: 0; bottom: 0; left: 0; z-index: 50; display: none;
    background: var(--bg) center/cover no-repeat; overflow-y: auto; }
  #detail.open { display: block; }
  #detail::before { content: ''; position: fixed; top: var(--bar-h); right: 0; bottom: 0; left: 0;
    background: linear-gradient(90deg, rgba(13,17,23,.96) 0%, rgba(13,17,23,.8) 45%, rgba(13,17,23,.55) 100%), linear-gradient(0deg, var(--bg) 0%, transparent 55%);
    pointer-events: none; }
  .d-inner { position: relative; padding: 5vh 3vw 6vh; min-height: 100%; display: flex; flex-direction: column; justify-content: flex-end; gap: 1.4vh; }
  .d-title { font-size: 3.6vw; font-weight: 900; margin: 6vh 0 0; line-height: 1.1; }
  .d-meta { display: flex; flex-wrap: wrap; gap: .8vw; align-items: center; font-size: 1.3vw; color: #c9d1d9; }
  .d-dot { opacity: .5; }
  .d-imdb { background: #f5c518; color: #000; font-weight: 900; padding: .2vh .6vw; border-radius: 4px; }
  .d-desc { font-size: 1.45vw; line-height: 1.55; max-width: 62vw; margin: .6vh 0 1vh; color: #e6edf3; }
  .d-actions { display: flex; flex-wrap: nowrap; gap: 10px; align-items: center; overflow-x: auto; padding: 8px; margin: 0 -8px; scrollbar-width: none; }
  .d-actions::-webkit-scrollbar { display: none; }
  /* Botones de temporada: tamaño de la prueba */
  .d-btn { flex: 0 0 auto; white-space: nowrap; background: rgba(255,255,255,.08); color: rgba(255,255,255,.7); border: 2px solid transparent; border-radius: 30px; padding: 8px 20px; font-size: clamp(.85rem, 1.2vw, 1rem); font-weight: 700; cursor: pointer; transition: all .2s ease; }
  .d-btn:focus { border-color: #00a8ff; background: rgba(0,168,255,.2); color: #fff; transform: scale(1.05); }
  .d-btn.active { background: #00a8ff; color: #001a2b; font-weight: 800; box-shadow: 0 4px 15px rgba(0,168,255,.4); }
  .d-btn.active:focus { border-color: #fff; box-shadow: none; }
  /* Botón Reproducir: tamaño de la prueba, rojo del index */
  .d-btn.play { display: flex; align-items: center; gap: 10px; background: var(--accent); color: #fff; border: 2px solid var(--accent); padding: clamp(10px, 1.4vh, 14px) clamp(22px, 2.6vw, 34px); border-radius: 30px; font-size: clamp(.9rem, 1.3vw, 1.05rem); font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
  .d-btn.play:focus { border-color: #fff; background: var(--accent); transform: none; box-shadow: 0 0 18px rgba(229,9,20,.7); }
  .d-eps { display: flex; gap: 16px; overflow-x: auto; overflow-y: hidden; padding: 12px 8px 14px; margin: 0 -8px; scroll-behavior: smooth; scrollbar-width: none; align-items: stretch; }
  .d-eps::-webkit-scrollbar { display: none; }
  /* Card de capítulo: 200 x 125 como la prueba */
  .ep-card { flex: 0 0 200px; min-width: 200px; max-width: 200px; height: 125px; border-radius: 14px; overflow: hidden; position: relative; background: var(--card) center/cover no-repeat; border: 2px solid transparent; cursor: pointer; display: flex; align-items: flex-end; transition: all .2s ease; }
  .ep-card::before { content: ''; position: absolute; inset: 0; background: linear-gradient(0deg, rgba(0,0,0,.92) 0%, rgba(0,0,0,.7) 45%, rgba(0,0,0,.15) 100%); }
  .ep-card:focus { border-color: #00a8ff; box-shadow: none; transform: scale(1.04); }
  .ep-info { position: relative; width: 100%; padding: 10px 12px; display: flex; flex-direction: column; gap: 3px; }
  .ep-num { align-self: flex-start; font-size: .7rem; font-weight: 800; color: #fff; background: rgba(255,255,255,.18); padding: 2px 8px; border-radius: 6px; text-transform: uppercase; letter-spacing: 1px; }
  .ep-title { font-size: 1.05rem; font-weight: 700; color: #fff; line-height: 1.1; text-shadow: 0 2px 6px rgba(0,0,0,.8); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ep-dur { font-size: .72rem; font-weight: 600; color: rgba(255,255,255,.7); margin-top: 2px; }

  .error { background: #3d1114; border: 1px solid #7a1c20; color: #ffb3b8; padding: 2vh; border-radius: 8px; font-size: 1.5vw; margin: 2vh 0; }
  .loader { text-align: center; padding: 10vh; color: var(--muted); font-size: 2vw; }

  /* ── Móvil (igual que la prueba) ── */
  @media (max-width: 640px) {
    :root { --poster-w: 75px; }
    .modal.srv { right: 0; bottom: 42vh; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(75px, 1fr)); gap: 6px; padding: 6px; }
    .ep-card { flex-basis: 170px; min-width: 170px; max-width: 170px; height: 105px; }
    .ep-title { font-size: 1rem; }
  }
</style>
</head>
<body>

<header id="topbar">
  <nav id="main-nav">
    <button data-view="canales" class="active" tabindex="0"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Canales</button>
    <button data-view="movies" tabindex="0"><svg viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="12" rx="2"/><path d="M3 8l3-4h4L7 8M10 8l3-4h4l-3 4"/></svg>Películas</button>
    <button data-view="tv" tabindex="0"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M10 8.5v4l4-2z"/><path d="M8 21h8"/></svg>Series</button>
    <button data-view="genres" tabindex="0"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="1"/><rect x="13" y="4" width="7" height="7" rx="1"/><rect x="4" y="13" width="7" height="7" rx="1"/><rect x="13" y="13" width="7" height="7" rx="1"/></svg>Géneros</button>
    <button data-view="search" tabindex="0"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l5 5"/></svg>Buscar</button>
  </nav>
</header>

<main id="app">
  <div class="loader" id="boot-msg">Cargando...</div>
</main>

<div id="detail">
  <div class="d-inner">
    <h1 class="d-title" id="d-title"></h1>
    <div class="d-meta" id="d-meta"></div>
    <p class="d-desc" id="d-desc"></p>
    <div class="d-actions" id="d-actions"></div>
    <div class="d-eps" id="d-eps"></div>
  </div>
</div>

<div class="modal" id="modal">
  <div class="modal-inner">
    <h3 id="modal-title">Cargando...</h3>
    <p id="modal-desc"></p>
    <div class="modal-row" id="modal-row"></div>
    <div class="modal-list" id="modal-list"></div>
    <button id="modal-close" tabindex="0">Cerrar</button>
  </div>
</div>

<div id="player">
  <div id="player-bar"></div>
  <video id="player-video" controls autoplay playsinline tabindex="0"></video>
  <div id="player-msg"></div>
</div>

<!-- HLS y FLV locales: hls.min.js y mpegts.min.js van en la misma carpeta que este index.html -->
<script src="hls.min.js"></script>
<script src="mpegts.min.js"></script>

<script>
/* ══════ CONSOLA DE DIAGNÓSTICO — la misma de index_pruebapeliculas, adaptada a este index ══════
   Abrir: tecla C · botón amarillo (405) · INFO/MENÚ (457) · botón "Consola" arriba a la derecha (táctil)
   Activar/desactivar el modo consola (se abre al elegir un servidor en vez de reproducir directo): tecla T · botón verde/rojo (404/403) */
(() => {
  const LOG = [], MAXL = 400;
  const pad = n => ('0' + n).slice(-2);
  const ts = () => { const d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds()); };
  const fmt = a => {
    if (typeof a === 'string') return a;
    if (a instanceof Error) return a.message || String(a);
    try { return JSON.stringify(a); } catch (_) { return String(a); }
  };
  function push(tag, args) {
    LOG.push((ts() + ' [' + tag + '] ' + Array.prototype.map.call(args, fmt).join(' ')).slice(0, 700));
    if (LOG.length > MAXL) LOG.shift();
  }
  ['log', 'info', 'warn', 'error'].forEach(k => {
    const orig = console[k] ? console[k].bind(console) : function () {};
    console[k] = function () { try { push(k.toUpperCase(), arguments); } catch (_) {} orig.apply(null, arguments); };
  });
  window.addEventListener('error', e => {
    try {
      const t = e.target;
      if (t && t !== window && (t.src || t.href)) push('RECURSO', ['No cargó: ' + (t.src || t.href)]);
      else push('ERROR', [(e.message || 'error') + ' @ ' + String(e.filename || '').split('/').pop() + ':' + (e.lineno || 0)]);
    } catch (_) {}
  }, true);
  window.addEventListener('unhandledrejection', e => { try { push('PROMESA', [(e.reason && (e.reason.message || e.reason)) || 'rechazada']); } catch (_) {} });

  /* Historial por host: cada intento de extracción queda registrado */
  let HIST = [];
  try { HIST = JSON.parse(localStorage.getItem('ph_ext_hist') || '[]'); } catch (_) {}
  function histPush(h) {
    HIST.push(h); if (HIST.length > 40) HIST = HIST.slice(-40);
    try { localStorage.setItem('ph_ext_hist', JSON.stringify(HIST)); } catch (_) {}
  }
  function histText() {
    const by = {};
    HIST.forEach(h => { const b = by[h.host] || (by[h.host] = { ok: 0, fail: 0 }); h.ok ? b.ok++ : b.fail++; });
    const rows = Object.keys(by).map(k => (by[k].fail ? '✗ ' : '✓ ') + k + '  OK:' + by[k].ok + '  FALLÓ:' + by[k].fail);
    const last = HIST.slice(-12).reverse().map(h => (h.ok ? '✓ ' : '✗ ') + h.host + ' · ' + h.ms + ' ms' + (h.err ? ' · ' + h.err : '') + '\n    ' + h.url);
    return '--- RESUMEN POR HOST ---\n' + (rows.join('\n') || '(vacío)') + '\n\n--- ÚLTIMOS INTENTOS ---\n' + (last.join('\n') || '(vacío)');
  }
  function libs() {
    try {
      const cap = window.Capacitor, http = cap && cap.Plugins && cap.Plugins.CapacitorHttp;
      return 'hls.js: ' + (window.Hls ? 'v' + (Hls.version || '?') + (Hls.isSupported() ? ' OK' : ' (no soportado)') : 'NO CARGÓ (falta hls.min.js)') +
        '\nmpegts.js (FLV): ' + (window.mpegts ? (mpegts.isSupported() ? 'OK' : 'no soportado') : 'NO CARGÓ (falta mpegts.min.js)') +
        '\nCapacitor: ' + (cap ? 'sí' : 'no') + ' · CapacitorHttp: ' + (http ? 'sí' : 'no');
    } catch (e) { return 'libs: ' + e.message; }
  }
  const logText = () => libs() + '\n\n' + histText() + '\n\n--- REGISTRO (lo más reciente, abajo) ---\n' + (LOG.join('\n') || '(vacío)');

  /* Modo consola: ON = al elegir un servidor se abre la consola con el diagnóstico y un botón Reproducir */
  let MODE = true;
  try { const m = localStorage.getItem('ph_console'); if (m !== null) MODE = (m === '1'); } catch (_) {}

  function copyText(t) {
    const fallback = () => {
      try {
        const ta = document.createElement('textarea');
        ta.value = t; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0;';
        document.body.appendChild(ta); ta.focus(); ta.select();
        const ok = document.execCommand('copy'); ta.remove(); return ok;
      } catch (_) { return false; }
    };
    try { if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t).then(() => true).catch(() => fallback()); } catch (_) {}
    return Promise.resolve(fallback());
  }

  const RED = '#e50914';
  let el = null;
  const isOpen = () => !!el && el.style.display !== 'none';

  function panel() {
    if (el) return el;
    el = document.createElement('div'); el.id = 'phcPanel';
    el.style.cssText = 'position:fixed;inset:3% 6%;z-index:99999;background:#0b1220;color:#e6edf7;border:2px solid ' + RED + ';border-radius:14px;display:none;flex-direction:column;overflow:hidden;';
    const bar = document.createElement('div');
    bar.style.cssText = 'display:flex;gap:14px;align-items:center;padding:12px 16px;background:#111b30;border-bottom:1px solid #2a3a5c;flex:0 0 auto;flex-wrap:wrap;';
    const mk = (id, txt) => {
      const b = document.createElement('button'); b.id = id; b.type = 'button'; b.textContent = txt;
      b.style.cssText = 'font:700 20px/1 sans-serif;padding:12px 26px;border-radius:10px;border:2px solid #3b4d75;background:#18243f;color:#e6edf7;outline:none;';
      b.addEventListener('focus', () => { b.style.borderColor = RED; b.style.background = '#4a0d12'; });
      b.addEventListener('blur', () => { b.style.borderColor = '#3b4d75'; b.style.background = '#18243f'; });
      return b;
    };
    const bClose = mk('phcClose', 'Cerrar'), bCopy = mk('phcCopy', 'Copiar'), bPlay = mk('phcPlay', 'Reproducir'), bReg = mk('phcReg', 'Registro');
    const st = document.createElement('span'); st.id = 'phcState'; st.style.cssText = 'font:18px sans-serif;color:#7fe3a0;';
    const title = document.createElement('span'); title.id = 'phcTitle'; title.style.cssText = 'font:700 18px sans-serif;color:#ff4d57;margin-left:auto;';
    bar.append(bClose, bCopy, bPlay, bReg, st, title);
    const pre = document.createElement('pre'); pre.id = 'phcTxt';
    pre.style.cssText = 'margin:0;padding:16px 22px;flex:1 1 auto;overflow:auto;font:18px/1.35 monospace;white-space:pre-wrap;word-break:break-all;';
    el.append(bar, pre);
    document.body.appendChild(el);
    const flash = (msg, ok) => { st.textContent = msg; st.style.color = ok ? '#7fe3a0' : '#ff8a8a'; clearTimeout(el._t); el._t = setTimeout(() => { st.textContent = ''; }, 2500); };
    bClose.addEventListener('click', close);
    bCopy.addEventListener('click', () => { copyText(pre.textContent).then(ok => flash(ok ? '✓ Copiado' : '✗ No se pudo copiar', ok)); });
    bPlay.addEventListener('click', () => {
      const pl = el._play;
      if (!pl) { flash('No hay enlace reproducible', false); return; }
      el._prev = null; close();
      if (window.PHC && window.PHC.onPlay) window.PHC.onPlay(pl);
    });
    bReg.addEventListener('click', () => show('REGISTRO', logText(), el._play, true));
    return el;
  }

  function show(title, text, play, toBottom) {
    const p = panel();
    if (!isOpen()) p._prev = document.activeElement;
    p._play = play || null;
    document.getElementById('phcTitle').textContent = title;
    document.getElementById('phcState').textContent = '';
    const bPlay = document.getElementById('phcPlay');
    bPlay.disabled = !play; bPlay.textContent = play ? 'Reproducir' : 'Reproducir ✗'; bPlay.style.opacity = play ? '1' : '0.4';
    const pre = document.getElementById('phcTxt'); pre.textContent = text;
    p.style.display = 'flex';
    pre.scrollTop = toBottom ? pre.scrollHeight : 0;
    try { (play ? bPlay : document.getElementById('phcClose')).focus(); } catch (_) {}
  }
  function close() {
    if (!el) return;
    el.style.display = 'none'; el._play = null;
    const p = el._prev; el._prev = null;
    if (p && document.body.contains(p) && p.focus) setTimeout(() => { try { p.focus(); } catch (_) {} }, 50);
  }
  const openLog = () => show('REGISTRO', logText(), null, true);

  /* Botón táctil arriba a la derecha (tabindex -1: el control remoto no cae en él; en TV usa C / T) */
  let tbtn = null;
  function paintToggle() {
    if (!tbtn) return;
    tbtn.textContent = MODE ? 'Consola ON' : 'Consola OFF';
    tbtn.style.background = MODE ? RED : '#30363d';
  }
  function setMode(on) {
    MODE = !!on;
    try { localStorage.setItem('ph_console', MODE ? '1' : '0'); } catch (_) {}
    push('CONSOLA', ['modo ' + (MODE ? 'ON: se abre al elegir un servidor' : 'OFF: reproduce directo')]);
    paintToggle();
  }
  function mkToggle() {
    tbtn = document.createElement('button'); tbtn.type = 'button'; tbtn.tabIndex = -1;
    tbtn.style.cssText = 'position:fixed;top:2px;right:2px;z-index:100001;font:700 11px/1 sans-serif;padding:3px 7px;border-radius:6px;border:1px solid #3b4d75;color:#fff;outline:none;opacity:.85;';
    let t = 0;
    tbtn.addEventListener('click', ev => { ev.stopPropagation(); ev.preventDefault(); if (isOpen()) return; if (Date.now() - t < 500) { setMode(!MODE); } else { openLog(); } t = Date.now(); });
    document.body.appendChild(tbtn); paintToggle();
  }
  if (document.body) mkToggle(); else document.addEventListener('DOMContentLoaded', mkToggle);

  /* Teclado / control remoto */
  document.addEventListener('keydown', e => {
    if (isOpen()) return;
    const typing = /INPUT|TEXTAREA/.test((document.activeElement || {}).tagName || '');
    if ((!typing && (e.key === 'c' || e.key === 'C')) || e.keyCode === 405 || e.keyCode === 457) { e.preventDefault(); e.stopPropagation(); openLog(); }
    else if ((!typing && (e.key === 't' || e.key === 'T')) || e.keyCode === 404 || e.keyCode === 403) { e.preventDefault(); e.stopPropagation(); setMode(!MODE); }
  }, true);
  document.addEventListener('keydown', e => {
    if (!isOpen()) return;
    const pre = document.getElementById('phcTxt');
    const btns = ['phcClose', 'phcCopy', 'phcPlay', 'phcReg'].map(id => document.getElementById(id)).filter(b => b && !b.disabled);
    if (['Escape', 'Backspace'].includes(e.key) || e.keyCode === 4) { e.preventDefault(); e.stopPropagation(); close(); }
    else if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); (btns.includes(document.activeElement) ? document.activeElement : btns[0]).click(); }
    else if (e.key === 'ArrowLeft' || e.key === 'ArrowRight') {
      e.preventDefault(); e.stopPropagation();
      const i = Math.max(0, btns.indexOf(document.activeElement));
      btns[(i + (e.key === 'ArrowRight' ? 1 : btns.length - 1)) % btns.length].focus();
    }
    else if (e.key === 'ArrowDown') { e.preventDefault(); e.stopPropagation(); pre.scrollTop += 140; }
    else if (e.key === 'ArrowUp') { e.preventDefault(); e.stopPropagation(); pre.scrollTop -= 140; }
  }, true);

  window.PHC = {
    log(tag, msg) { push(tag, [msg]); },
    tail(n) { return LOG.slice(-n).join('\n'); },
    histPush, show, openLog, close, isOpen, onPlay: null,
    get mode() { return MODE; }
  };
  push('INICIO', ['consola lista · ' + libs().replace(/\n/g, ' · ')]);
})();

<script>
(() => {
  const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36';
  const RAW_BASE = 'https://raw.githubusercontent.com/iptv-tec/Contenido/main/';

  const plog = (tag, msg) => { try { PHC.log(tag, msg); } catch (e) {} };
  const hostOf = u => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch (e) { return String(u || '').slice(0, 40); } };
  const safeJson = o => { try { return JSON.stringify(o, null, 1).slice(0, 1500); } catch (e) { return String(o); } };

  // Archivos que se descargan de GitHub y se guardan en caché según version.json
  const ARCHIVOS = [
    { clave: 'version',           archivo: 'canales.json',             cache: 'ph_cache_canales',   nombre: 'canales' },
    { clave: 'cinehax_version',   archivo: 'proveedor_cinehax.js',     cache: 'ph_cache_cinehax',   nombre: 'proveedor de películas y series' },
    { clave: 'extractor_version', archivo: 'extractor_moviemaster.js', cache: 'ph_cache_extractor', nombre: 'extractor de video' }
  ];

  const app = document.getElementById('app');
  const navButtons = document.querySelectorAll('#main-nav button');
  const modal = document.getElementById('modal');
  const mTitle = document.getElementById('modal-title');
  const mDesc = document.getElementById('modal-desc');
  const mRow = document.getElementById('modal-row');
  const mList = document.getElementById('modal-list');
  const mClose = document.getElementById('modal-close');
  const playerEl = document.getElementById('player');
  const playerBar = document.getElementById('player-bar');
  const playerMsg = document.getElementById('player-msg');
  const video = document.getElementById('player-video');

  let provider = null, extractor = null, canales = null, vistaActual = 'canales';

  // ---------- Utilidades ----------
  const HTTP_MS = 15000;
  async function httpGet(url, referer, extraHeaders) {
    const cap = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
    if (!cap) throw new Error('CapacitorHttp no está disponible.');
    const headers = Object.assign({ 'User-Agent': UA, 'Accept': 'text/html,application/json,*/*' }, extraHeaders || {});
    if (referer) headers['Referer'] = referer;
    const corto = url.replace(/^https?:\/\//, '').slice(0, 70);
    const t0 = Date.now();
    try {
      const res = await Promise.race([
        cap.get({ url, headers, connectTimeout: 10000, readTimeout: HTTP_MS }),
        new Promise((_, rej) => setTimeout(() => rej(new Error('Tiempo agotado (' + (HTTP_MS / 1000) + ' s)')), HTTP_MS + 3000))
      ]);
      const body = typeof res.data === 'string' ? res.data : JSON.stringify(res.data);
      window.PH.last = 'HTTP ' + res.status + ' · ' + body.length + ' bytes · ' + (Date.now() - t0) + ' ms · ' + corto;
      plog('HTTP', window.PH.last);
      if (res.status >= 400) throw new Error('HTTP ' + res.status);
      if (/just a moment|cf-chl|attention required/i.test(body.slice(0, 4000)) && !/scroll-section/.test(body)) throw new Error('Bloqueado por Cloudflare');
      return body;
    } catch (e) {
      window.PH.last = 'ERROR: ' + ((e && e.message) || e) + ' · ' + (Date.now() - t0) + ' ms · ' + corto;
      plog('HTTP', window.PH.last);
      throw e;
    }
  }

  function diag() {
    return window.PH && window.PH.last
      ? '<div style="font-size:1.1vw;opacity:.8;margin-top:1vh;word-break:break-all">Último intento: ' + escapeHtml(window.PH.last) + '</div>' : '';
  }

  function fixUrl(u, base) {
    if (!u) return '';
    if (u.startsWith('http')) return u;
    if (u.startsWith('//')) return 'https:' + u;
    return base + (u.startsWith('/') ? '' : '/') + u;
  }

  function escapeHtml(s) { return (s || '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  // El proveedor y el extractor descargados usan estas funciones
  window.PH = { httpGet, fixUrl, escapeHtml, UA };

  // ---------- Caché local + descarga por versión ----------
  const MEM = {};
  const LS = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }
  };

  function setBoot(msg) {
    const el = document.getElementById('boot-msg');
    if (el) el.textContent = msg;
  }

  async function fetchRaw(file, ms) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), ms || 8000);
    try {
      const r = await fetch(RAW_BASE + file + '?t=' + Date.now(), { cache: 'no-store', signal: ctl.signal });
      if (!r.ok) throw new Error('HTTP ' + r.status + ' ' + file);
      return await r.text();
    } finally { clearTimeout(t); }
  }

  // Carga SIEMPRE desde la copia guardada (instantáneo). Devuelve true si había todo.
  function cargarDesdeCache() {
    const leer = a => MEM[a.cache] || LS.get(a.cache);
    try { canales = JSON.parse(leer(ARCHIVOS[0]) || 'null'); } catch (e) { canales = null; }
    for (const a of [ARCHIVOS[1], ARCHIVOS[2]]) {
      const code = leer(a);
      if (!code) continue;
      try { new Function(code)(); } catch (e) { console.error('Error ejecutando ' + a.archivo, e); }
    }
    provider = window.PH_CINEHAX || null;
    extractor = window.PH_EXTRACTOR || null;
    return !!(canales && provider && extractor);
  }

  // Revisa version.json y descarga SOLO lo que cambió. Devuelve las claves de caché actualizadas.
  async function revisarActualizaciones() {
    let remota = null;
    try { remota = JSON.parse(await fetchRaw('version.json', 6000)); } catch (e) { console.warn('version.json no disponible', e); }
    let locales = {};
    try { locales = JSON.parse(LS.get('ph_versiones') || '{}'); } catch (e) { locales = {}; }
    const actualizados = [];
    for (const a of ARCHIVOS) {
      const guardado = MEM[a.cache] || LS.get(a.cache);
      const hayRemota = remota && remota[a.clave] !== undefined;
      const cambio = hayRemota && remota[a.clave] !== locales[a.clave];
      if (guardado && !cambio) continue;
      if (!remota && guardado) continue;
      setBoot('Descargando ' + a.nombre + '...');
      try {
        const txt = await fetchRaw(a.archivo, 15000);
        MEM[a.cache] = txt;
        if (LS.set(a.cache, txt) && hayRemota) locales[a.clave] = remota[a.clave];
        actualizados.push(a.cache);
      } catch (e) { console.warn('No se pudo descargar ' + a.archivo, e); }
    }
    LS.set('ph_versiones', JSON.stringify(locales));
    return actualizados;
  }

  // ---------- Tarjetas y vistas ----------
  function cardHTML(s) {
    const img = s.poster ? `<img src="${escapeHtml(s.poster)}" onerror="this.style.opacity=.3" loading="lazy">` : `<img loading="lazy">`;
    return `<div class="card poster" tabindex="0" data-id="${escapeHtml(s.id)}" data-type="${s.type}">
      ${img}
      <div class="meta"><div class="title">${escapeHtml(s.title)}</div></div>
    </div>`;
  }

  function autoFocus() {
    setTimeout(() => {
      /* Si el foco ya está en algún lado (p. ej. la barra de secciones tras pulsar OK), no se roba */
      const ae = document.activeElement;
      if (ae && ae !== document.body && document.body.contains(ae)) return;
      const first = app.querySelector('.card, .genre-card, input, button');
      if (first) first.focus();
    }, 100);
  }

  function bindCards(container) {
    container.querySelectorAll('.card[data-id]').forEach(c => {
      c.addEventListener('click', () => {
        const t = c.querySelector('.title'), im = c.querySelector('img');
        openDetail(c.getAttribute('data-type'), c.getAttribute('data-id'), t ? t.textContent : '', im ? im.getAttribute('src') : '', c);
      });
      c.addEventListener('keydown', (e) => { if (e.key === 'Enter') c.click(); });
    });
  }

  function needProvider() {
    if (provider) return false;
    app.innerHTML = '<div class="error">No se pudo cargar el proveedor de películas y series. Revisa tu conexión y reabre la app.</div>';
    return true;
  }

  function renderHome(cats, noFocus) {
    let html = '';
    for (const cat of cats) {
      html += `<div class="section"><h2>${escapeHtml(cat.name)}</h2><div class="carousel posters">${cat.list.map(cardHTML).join('')}</div></div>`;
    }
    app.innerHTML = html || '<div class="loader">Sin resultados</div>';
    bindCards(app);
    if (!noFocus) autoFocus();
  }

  function renderGrid(title, shows) {
    app.innerHTML = `<div class="section"><h2>${escapeHtml(title)}</h2><div class="grid">${shows.map(cardHTML).join('')}</div></div>`;
    bindCards(app);
    autoFocus();
  }

  async function showHome(filterType) {
    if (needProvider()) return;
    const key = 'ph_home_' + filterType;
    let cached = null;
    try { cached = JSON.parse(LS.get(key) || 'null'); } catch (e) { cached = null; }
    const hayCache = Array.isArray(cached) && cached.length > 0;
    if (hayCache) renderHome(cached);
    else app.innerHTML = `<div class="loader">Cargando ${filterType === 'movie' ? 'películas' : 'series'}...</div>`;
    try {
      const cats = await provider.home(filterType);
      if (!cats.length) { if (!hayCache) app.innerHTML = '<div class="error">No se encontraron resultados.' + diag() + '</div>'; return; }
      const ser = JSON.stringify(cats);
      const nuevo = ser !== LS.get(key);
      if (nuevo) LS.set(key, ser);
      if (vistaActual !== (filterType === 'movie' ? 'movies' : 'tv')) return;
      if (!hayCache) { renderHome(cats); return; }
      // Ya se mostró la copia guardada: si hay cambios, se refresca en pantalla sin perder la posición
      const ocupado = detail.classList.contains('open') || modal.classList.contains('open') || playerEl.classList.contains('open');
      if (nuevo && !ocupado) {
        const act = document.activeElement;
        const id = act && app.contains(act) && act.getAttribute ? act.getAttribute('data-id') : null;
        const top = app.scrollTop;
        renderHome(cats, true);
        app.scrollTop = top;
        if (id) { const el = Array.from(app.querySelectorAll('.card[data-id]')).find(c => c.getAttribute('data-id') === id); if (el) el.focus(); }
      }
    } catch (e) { if (!hayCache) app.innerHTML = `<div class="error">Error: ${escapeHtml(e.message)}${diag()}</div>`; }
  }

  function renderGenres() {
    if (needProvider()) return;
    let html = `<div class="section"><h2>Categorías</h2><div class="grid genres">`;
    provider.genres.forEach(([id, name]) => {
      html += `<div class="card genre-card" tabindex="0" data-genre="${escapeHtml(id)}">${escapeHtml(name)}</div>`;
    });

    app.innerHTML = html;
    app.querySelectorAll('.genre-card').forEach(el => {
      el.addEventListener('click', () => loadGenre(el.getAttribute('data-genre')));

  async function loadGenre(id) {

  function renderSearchView() {
    if (needProvider()) return;
    app.innerHTML = `
      <div class="search-view">
        <div class="search-box">

      const q = input.value.trim();

  // ---------- Canales ----------
  function renderCanales() {
    if (!canales || !canales.lista) {
      app.innerHTML = '<div class="error">No hay canales cargados. Revisa tu conexión y reabre la app.</div>';

  // ---------- Reproductor ----------
  let hls = null, flv = null, resumeModal = false, lastFocus = null;

  function b64ToBuf(b64) {
    const bin = atob(b64); const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    return bytes.buffer;
  }

  // Cargador de hls.js que pasa por CapacitorHttp (permite Referer / User-Agent y evita CORS)
  function makeNativeLoader(baseHeaders) {
    return class NativeLoader {
      constructor() {
        this.stats = { aborted: false, loaded: 0, retry: 0, total: 0, chunkCount: 0, bwEstimate: 0,
          loading: { start: 0, first: 0, end: 0 }, parsing: { start: 0, end: 0 }, buffering: { start: 0, first: 0, end: 0 } };
        this.context = null;
      }
      destroy() { this.stats.aborted = true; }
      abort() { this.stats.aborted = true; }
      getCacheAge() { return null; }
      load(context, config, callbacks) {
        this.context = context;
        const stats = this.stats;
        stats.loading.start = performance.now();
        const bin = context.responseType === 'arraybuffer';
        const headers = Object.assign({}, baseHeaders);
        if (context.rangeStart !== undefined && context.rangeEnd !== undefined) {
          headers['Range'] = `bytes=${context.rangeStart}-${context.rangeEnd - 1}`;
        }
        window.Capacitor.Plugins.CapacitorHttp.get({ url: context.url, headers, responseType: bin ? 'arraybuffer' : 'text' })
          .then(res => {
            if (stats.aborted) return;
            if (res.status >= 400) { callbacks.onError({ code: res.status, text: 'HTTP ' + res.status }, context, null, stats); return; }
            const data = bin ? b64ToBuf(res.data) : (typeof res.data === 'string' ? res.data : JSON.stringify(res.data));
            stats.loading.first = stats.loading.end = performance.now();
            stats.loaded = stats.total = bin ? data.byteLength : data.length;
            callbacks.onSuccess({ url: context.url, data }, stats, context, null);
          })
          .catch(err => {
            if (!stats.aborted) callbacks.onError({ code: 0, text: String((err && err.message) || err) }, context, null, stats);
          });
      }
    };
  }

  function destroyPlayers() {
    if (hls) { hls.destroy(); hls = null; }
    if (flv) { flv.destroy(); flv = null; }
    video.pause(); video.removeAttribute('src'); video.load();
  }

  let srvBtn = null;   // servidor elegido (para devolverle el foco al volver del reproductor)
  function restoreFocus(el) {
    if (el && document.body.contains(el)) rcFocus(el);
    else { const a = document.querySelector('#main-nav button.active'); if (a) a.focus(); }
  }
  function openPlayer(title, resume) {
    /* Canal: el origen es la tarjeta del canal. Película/serie (resume): el origen (Reproducir / capítulo)
       ya se guardó al abrir el modal; aquí solo se recuerda qué servidor se eligió. */
    if (resume) { if (mList.contains(document.activeElement)) srvBtn = document.activeElement; }
    else lastFocus = document.activeElement;
    resumeModal = !!resume;
    playerBar.textContent = title;
    playerMsg.textContent = 'Cargando...';
    playerEl.classList.add('open');
    setTimeout(() => video.focus(), 100);
  }

  function stopPlayer() {
    destroyPlayers();
    playerEl.classList.remove('open');
    if (resumeModal) {
      modal.classList.add('open');
      const f = (srvBtn && mList.contains(srvBtn)) ? srvBtn : (mList.querySelector('button') || mClose);
      setTimeout(() => f.focus(), 100);
    } else {
      const t = lastFocus;
      setTimeout(() => restoreFocus(t), 100);   // canal: vuelve al canal seleccionado
    }
  }

  // Diagnóstico de un 403/error en el manifiesto: repite la petición con distintas combinaciones de headers
  async function probeManifest(url, headers) {
    const cap = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp;
    if (!cap) return;
    let origin = ''; try { origin = new URL(headers.Referer || headers.referer).origin; } catch (e) {}
    const variants = [
      ['headers del extractor', headers],
      ['+ Origin', Object.assign({}, headers, origin ? { Origin: origin } : {})],
      ['+ Origin + Accept */*', Object.assign({ Accept: '*/*' }, headers, origin ? { Origin: origin } : {})],
      ['solo User-Agent', { 'User-Agent': headers['User-Agent'] || '' }],
      ['sin headers', {}]
    ];
    plog('PRUEBA', 'Probando el manifiesto con ' + variants.length + ' combinaciones de headers…');
    for (const [name, h] of variants) {
      try {
        const r = await cap.get({ url, headers: h, responseType: 'text', connectTimeout: 10000, readTimeout: 10000 });
        const body = typeof r.data === 'string' ? r.data : JSON.stringify(r.data);
        const rh = r.headers || {};
        const ct = rh['Content-Type'] || rh['content-type'] || '?';
        const ck = (rh['Set-Cookie'] || rh['set-cookie']) ? 'sí' : 'no';
        plog('PRUEBA', name + ' → HTTP ' + r.status + ' · ' + ct + ' · ' + body.length + ' bytes · set-cookie: ' + ck + ' · ' + body.slice(0, 200).replace(/\s+/g, ' '));
        if (r.status < 400) { plog('PRUEBA', '✓ FUNCIONA con: ' + name); return; }
      } catch (e) { plog('PRUEBA', name + ' → ERROR ' + ((e && e.message) || e)); }
    }
    plog('PRUEBA', 'Ninguna combinación funcionó.');
  }

  function playHls(url, headers) {
    if (window.Hls && Hls.isSupported()) {
      const cfg = {};
      if (headers && window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorHttp) {
        cfg.loader = makeNativeLoader(headers);
      }
      plog('HLS', 'v' + Hls.version + ' · ' + url + (cfg.loader ? ' · loader nativo (headers: ' + Object.keys(headers).join(', ') + ')' : ' · loader normal'));
      hls = new Hls(cfg);
      hls.loadSource(url);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, (e, d) => {
        plog('HLS', 'manifest OK · niveles: ' + (d && d.levels ? d.levels.length : '?'));
        video.play().catch(err => plog('VIDEO', 'play() rechazado: ' + ((err && err.message) || err)));
      });
      hls.on(Hls.Events.ERROR, (e, d) => {
        if (!d) return;
        plog('HLS', (d.fatal ? 'FATAL ' : 'error ') + d.type + '/' + d.details + (d.response && d.response.code !== undefined ? ' · HTTP ' + d.response.code : '') + (d.url ? ' · ' + String(d.url).slice(0, 100) : ''));
        if (d.fatal) {
          playerMsg.textContent = 'No se pudo reproducir este video.';
          const after = () => { if (PHC.mode) PHC.openLog(); };
          if (d.details === 'manifestLoadError' && headers) probeManifest(url, headers).then(after, after); else after();
        }
      });
    } else {
      plog('HLS', (window.Hls ? 'hls.js no soportado' : 'hls.js NO cargó (¿falta hls.min.js?)') + ' · se usa <video src> directo · ' + url);
      video.src = url;
      video.play().catch(() => {});
    }
  }

  video.addEventListener('playing', () => { playerMsg.textContent = ''; plog('VIDEO', 'reproduciendo'); });
  video.addEventListener('loadedmetadata', () => plog('VIDEO', 'metadata · ' + video.videoWidth + 'x' + video.videoHeight + ' · ' + Math.round(video.duration || 0) + ' s'));
  video.addEventListener('stalled', () => plog('VIDEO', 'stalled (sin datos)'));
  video.addEventListener('error', () => { const er = video.error; plog('VIDEO', 'error ' + (er ? er.code + ' ' + (er.message || '') : '?')); if (PHC.mode) PHC.openLog(); });

  function playChannel(c) {
    openPlayer(c.nombre, false);
    const u = (c.url || '').toLowerCase();
    if (u.includes('.flv') && window.mpegts && mpegts.isSupported()) {
      plog('FLV', 'mpegts · ' + c.url);
      flv = mpegts.createPlayer({ type: 'flv', isLive: true, url: c.url }, { enableWorker: true });
      flv.on(mpegts.Events.ERROR, (t, d, info) => plog('FLV', 'error ' + t + '/' + d + ' ' + ((info && info.msg) || '')));
      flv.attachMediaElement(video); flv.load(); flv.play().catch(() => {});
    } else if (u.includes('.m3u')) {
      plog('CANAL', c.nombre + ' · ' + c.url);
      playHls(c.url, null);
    } else {
      video.src = c.url; video.play().catch(() => {});
    }
  }

  // ---------- Modal de detalle / episodios / servidores ----------
  let modalBack = null;

  function addOpt(container, label, onClick, selected) {
    const b = document.createElement('button');
    b.className = 'opt' + (selected ? ' sel' : '');
    b.tabIndex = 0;
    b.textContent = label;
    b.addEventListener('click', onClick);
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter') b.click(); });
    container.appendChild(b);
    return b;
  }

  function setModal(title, desc, back, srv) {
    modal.classList.toggle('srv', !!srv);
    mTitle.textContent = title;
    mDesc.textContent = desc || '';
    mDesc.style.display = desc ? '' : 'none';
    mRow.innerHTML = ''; mList.innerHTML = '';
    modalBack = back || null;
    mClose.textContent = modalBack ? 'Volver' : 'Cerrar';
  }

  function focusModal() {
    setTimeout(() => {
      const f = mList.querySelector('button') || mRow.querySelector('button') || mClose;
      f.focus();
    }, 100);
  }

  function closeModal() {
    modal.classList.remove('open');
    modalBack = null;
    restoreFocus(lastFocus);   // película: Reproducir · serie: capítulo elegido
  }

  // ---------- Pantalla de detalle ----------
  const detail = document.getElementById('detail');
  const dTitle = document.getElementById('d-title'), dMeta = document.getElementById('d-meta'),
        dDesc = document.getElementById('d-desc'), dActions = document.getElementById('d-actions'),
        dEps = document.getElementById('d-eps');
  let detailCard = null;

  function closeDetail() {
    detail.classList.remove('open');
    detail.style.backgroundImage = '';
    const dc = detailCard; detailCard = null;
    restoreFocus(dc);   // vuelve al póster elegido
  }

  function dBtn(label, cls, onClick) {
    const b = document.createElement('button');
    b.className = 'd-btn ' + (cls || '');
    b.tabIndex = 0; b.textContent = label;
    b.addEventListener('click', onClick);
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter') b.click(); });
    dActions.appendChild(b);
    return b;
  }

  function metaHTML(M, d) {
    const parts = [M.type === 'tv' ? 'Serie' : 'Película'];
    const gen = Array.isArray(d.genres) ? d.genres.join(' · ') : (d.genres || '');
    if (gen) parts.push(gen);
    const year = d.year || d.releaseInfo || '';
    if (year) parts.push(year);
    let h = parts.map(p => '<span>' + escapeHtml(String(p)) + '</span>').join('<span class="d-dot">•</span>');
    const rt = d.rating || d.imdbRating || d.imdb;
    if (rt) h += '<span class="d-imdb">IMDb</span><span>' + escapeHtml(String(rt)) + '</span>';
    return h;
  }

  async function openDetail(type, id, title, poster, cardEl) {
    detailCard = cardEl || document.activeElement;
    const M = { type, id, title: title || (type === 'tv' ? 'Serie' : 'Película'), poster: poster || '', season: null, eps: {}, seasons: [] };
    dTitle.textContent = M.title;
    dMeta.innerHTML = metaHTML(M, {});
    dDesc.textContent = 'Cargando sinopsis...';
    dActions.innerHTML = ''; dEps.innerHTML = '';
    detail.style.backgroundImage = M.poster ? `url('${M.poster}')` : 'none';
    detail.scrollTop = 0;
    detail.classList.add('open');
    detail.tabIndex = -1; detail.focus();
    try {
      const d = await provider.detail(type, id);
      M.d = d;
      if (d.title) { M.title = d.title; dTitle.textContent = d.title; }
      const bg = d.backdrop || d.background || d.poster || M.poster;
      if (bg) detail.style.backgroundImage = `url('${bg}')`;
      dMeta.innerHTML = metaHTML(M, d);
      dDesc.textContent = d.overview || 'No se encontró sinopsis para este título.';
      M.seasons = d.seasons || [];
      renderDetailActions(M);
      if (type === 'tv' && M.seasons.length) selectSeason(M, M.seasons[0]);
    } catch (e) {
      dDesc.innerHTML = 'Error de conexión al cargar la ficha. Revisa tu conexión a internet.' + diag();
      console.error(e);
    }
  }

  function renderDetailActions(M) {
    dActions.innerHTML = '';
    if (M.type === 'movie') {
      const p = dBtn('▶ Reproducir', 'play', () => showServers({ type: 'movie', id: M.id }, M.title));
      setTimeout(() => p.focus(), 80);
    } else {
      M.seasons.forEach(n => dBtn('Temporada ' + n, n === M.season ? 'active' : '', () => selectSeason(M, n)));
    }
  }

  async function selectSeason(M, n) {
    M.season = n;
    renderDetailActions(M);
    if (!M.eps[n]) {
      dEps.innerHTML = '<div class="loader" style="padding:2vh;font-size:1.4vw">Cargando episodios...</div>';
      try { M.eps[n] = await provider.episodes(M.id, n); } catch (e) { M.eps[n] = []; }
      if (M.season !== n) return;
    }
    renderEpisodes(M);
    const act = dActions.querySelector('.d-btn.active'); if (act) act.focus();
  }

  function renderEpisodes(M) {
    const eps = M.eps[M.season] || [];
    dEps.innerHTML = '';
    if (!eps.length) { dEps.innerHTML = '<div class="loader" style="padding:2vh;font-size:1.4vw">No se encontraron episodios.</div>'; return; }
    eps.forEach(ep => {
      const c = document.createElement('div');
      c.className = 'ep-card'; c.tabIndex = 0;
      const img = ep.thumbnail || ep.thumb || ep.image || ep.still || M.poster || '';
      if (img) c.style.backgroundImage = `url('${img}')`;
      const dur = ep.runtime || ep.duration || '';
      c.innerHTML = `<div class="ep-info"><span class="ep-num">EPISODIO ${escapeHtml(String(ep.number))}</span>
        <div class="ep-title">${escapeHtml(ep.title || 'Episodio ' + ep.number)}</div>
        ${dur ? `<div class="ep-dur">⏱ ${escapeHtml(String(dur))}${/\d$/.test(String(dur)) ? ' min' : ''}</div>` : ''}</div>`;
      c.addEventListener('click', () => showServers({ type: 'tv', id: M.id, season: M.season, episode: ep.number }, `${M.title} · T${M.season}E${ep.number}`));
      c.addEventListener('keydown', (e) => { if (e.key === 'Enter') c.click(); });
      dEps.appendChild(c);
    });
  }

  // ---------- Modal de servidores ----------
  async function showServers(media, label) {
    lastFocus = document.activeElement;
    setModal(label, 'Buscando servidores...', null, true);
    modal.classList.add('open');
    mClose.focus();
    plog('SERVIDORES', 'Buscando para ' + label);
    if (!extractor) { mDesc.textContent = 'El extractor de video no está disponible.'; plog('SERVIDORES', 'extractor NO disponible'); return; }
    let servers = [];
    try { servers = await extractor.servers(media); } catch (e) { console.error(e); }
    if (!servers.length) { plog('SERVIDORES', 'ninguno · ' + (window.PH.last || '')); mDesc.textContent = 'No se encontraron servidores para este título.' + (window.PH.last ? ' (' + window.PH.last + ')' : ''); return; }
    plog('SERVIDORES', servers.length + ' → ' + servers.map(s => s.name).join(', '));
    mDesc.textContent = 'Elige un servidor:';
    servers.forEach(s => addOpt(mList, s.name, () => playServer(s, label)));
    focusModal();
  }

  function playResolved(pl) {
    modal.classList.remove('open');
    openPlayer(pl.label, true);
    playHls(pl.source, pl.headers);
  }
  if (window.PHC) window.PHC.onPlay = playResolved;

  async function playServer(server, label) {
    mDesc.textContent = 'Obteniendo video...';
    const host = hostOf(server.src), t0 = Date.now(), url = String(server.src).slice(0, 90);
    plog('EXTRACT', 'Servidor «' + server.name + '» · ' + server.src);
    try {
      const v = await extractor.extract(server.src);
      const ms = Date.now() - t0;
      plog('EXTRACT', 'OK ' + ms + ' ms · ' + v.source);
      PHC.histPush({ host, ok: true, ms, url });
      const pl = { source: v.source, headers: v.headers, label };
      if (PHC.mode) {
        mDesc.textContent = 'Elige un servidor:';
        PHC.show('EXTRACTOR: OK', 'Servidor: ' + server.name + '\nEmbed: ' + server.src + '\nTiempo: ' + ms + ' ms\n\nURL: ' + v.source +
          '\nHeaders: ' + safeJson(v.headers || {}) + '\n\n--- Respuesta completa del extractor ---\n' + safeJson(v), pl);
        return;
      }
      playResolved(pl);
    } catch (e) {
      const ms = Date.now() - t0, msg = (e && e.message) || String(e);
      plog('EXTRACT', 'FALLÓ ' + ms + ' ms · ' + msg);
      PHC.histPush({ host, ok: false, ms, url, err: msg.slice(0, 80) });
      mDesc.textContent = 'No se pudo obtener el video de este servidor. Prueba con otro.';
      console.error(e);
      if (PHC.mode) PHC.show('EXTRACTOR: FALLÓ', 'Servidor: ' + server.name + '\nEmbed: ' + server.src + '\nError: ' + msg +
        '\nÚltima petición: ' + (window.PH.last || '-') + '\n\n--- Últimas líneas del registro ---\n' + PHC.tail(25), null);
    }
  }

  mClose.addEventListener('click', () => { if (modalBack) modalBack(); else closeModal(); });
  mClose.addEventListener('keydown', (e) => { if (e.key === 'Enter') mClose.click(); });

  // ---------- Botón Atrás ----------
  let _ultimoAtras = 0;
  function handleBack() {
    const ahora = Date.now();
    if (ahora - _ultimoAtras < 300) return;   // evita doble disparo
    _ultimoAtras = ahora;
    if (PHC.isOpen()) { PHC.close(); return; }   // la consola se cierra primero
    if (playerEl.classList.contains('open')) { stopPlayer(); return; }
    if (modal.classList.contains('open')) { mClose.click(); return; }
    if (detail.classList.contains('open')) { closeDetail(); return; }
    if (vistaActual !== 'canales') { navButtons[0].click(); navButtons[0].focus(); return; }
    // En Canales: confirmar salida
    lastFocus = document.activeElement;
    setModal('¿Salir de la aplicación?', '', null);
    mClose.textContent = 'Cancelar';
    addOpt(mList, 'Salir', () => {
      const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
      if (App && App.exitApp) App.exitApp(); else window.close();
    });
    modal.classList.add('open');
    focusModal();
  }

  // Android (Capacitor): el botón Atrás llega como evento "backButton", no como tecla
  try {
    const App = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.App;
    if (App && App.addListener) App.addListener('backButton', () => handleBack());
    else plog('ATRÁS', 'Plugin App de Capacitor no disponible: se usa el historial como respaldo');
  } catch (e) { console.warn('No se pudo registrar backButton', e); }

  // Respaldo: si Android entrega Atrás al WebView (historial) en vez de a JS, se captura aquí y no se cierra la app
  try {
    history.pushState({ ph: 1 }, '');
    window.addEventListener('popstate', () => { history.pushState({ ph: 1 }, ''); handleBack(); });
  } catch (e) { console.warn('No se pudo preparar el historial', e); }

  // Control remoto / teclado
  window.addEventListener('keydown', (e) => {
    if (e.key === 'Backspace' || e.key === 'Escape' || e.key === 'GoBack' || e.key === 'BrowserBack' || e.keyCode === 4) {
      const t = e.target;
      if (e.key === 'Backspace' && t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) return;
      e.preventDefault();
      handleBack();
    }
  });

  // ---------- Control remoto (↑ ↓ ← →) ----------
  // El foco se mueve por secciones, canales, películas y series; solo OK (Enter) elige.
  // Barra de secciones: ←/→ mueve el foco, ↓ baja al contenido, ↑ se queda en la barra.
  // Contenido: ←/→ dentro de la fila, ↑/↓ entre filas; ↑ desde la primera fila vuelve a la sección activa.
  const navList = Array.from(navButtons);

  function rcScrollX(el) {
    const sc = el.closest('.carousel, .d-eps, .d-actions');
    if (!sc || sc.scrollWidth <= sc.clientWidth) return;
    const r = el.getBoundingClientRect(), c = sc.getBoundingClientRect();
    const left = sc.scrollLeft + (r.left - c.left) - (c.width - r.width) / 2;
    try { sc.scrollTo({ left: Math.max(0, left), behavior: 'smooth' }); } catch (_) { sc.scrollLeft = Math.max(0, left); }
  }
  function rcScrollY(el, box) {
    const sec = el.closest('.section');
    const t = (sec && sec.offsetHeight <= box.clientHeight) ? sec : el;   // se intenta ver la fila completa con su título
    const r = t.getBoundingClientRect(), c = box.getBoundingClientRect();
    if (r.top < c.top + 8) box.scrollTop -= (c.top + 8 - r.top);
    else if (r.bottom > c.bottom - 8) box.scrollTop += (r.bottom - c.bottom + 8);
  }
  function rcFocus(el) {
    if (!el) return;
    try { el.focus({ preventScroll: true }); } catch (_) { el.focus(); }
    rcScrollX(el);
    const box = detail.classList.contains('open') ? detail : app;
    if (box.contains(el)) rcScrollY(el, box);
  }

  // Filas navegables de la vista actual (o del detalle si está abierto), en orden de pantalla
  function rcRows() {
    if (detail.classList.contains('open')) {
      return [Array.from(dActions.querySelectorAll('button')), Array.from(dEps.querySelectorAll('.ep-card'))].filter(r => r.length);
    }
    const rows = [];
    const qi = document.getElementById('q-input'), qb = document.getElementById('btn-search');
    if (qi) rows.push([qi, qb].filter(Boolean));
    app.querySelectorAll('.carousel').forEach(c => { const r = Array.from(c.querySelectorAll('.card')); if (r.length) rows.push(r); });
    app.querySelectorAll('.grid').forEach(g => {
      const m = new Map();
      g.querySelectorAll('.card').forEach(c => { const k = c.offsetTop; if (!m.has(k)) m.set(k, []); m.get(k).push(c); });
      m.forEach(r => rows.push(r));
    });
    rows.sort((a, b) => (a[0].compareDocumentPosition(b[0]) & Node.DOCUMENT_POSITION_FOLLOWING) ? -1 : 1);
    return rows;
  }

  // Elemento de la fila más cercano en horizontal al actual
  function rcNearest(row, from) {
    const fr = from.getBoundingClientRect(), cx = (fr.left + fr.right) / 2;
    let best = row[0], bd = Infinity;
    row.forEach(el => { const r = el.getBoundingClientRect(), d = Math.abs((r.left + r.right) / 2 - cx); if (d < bd) { bd = d; best = el; } });
    return best;
  }

  window.addEventListener('keydown', (e) => {
    const k = e.key;
    if (k !== 'ArrowUp' && k !== 'ArrowDown' && k !== 'ArrowLeft' && k !== 'ArrowRight') return;
    if (e.defaultPrevented || e.altKey || e.ctrlKey || e.metaKey) return;
    if (PHC.isOpen() || playerEl.classList.contains('open')) return;   // consola y reproductor llevan lo suyo
    const ae = document.activeElement;

    // Modal (servidores / salir): ↑/↓ recorren las opciones
    if (modal.classList.contains('open')) {
      e.preventDefault();
      const items = Array.from(modal.querySelectorAll('#modal-row button, #modal-list button, #modal-close'));
      const i = items.indexOf(ae);
      const t = k === 'ArrowDown' ? items[i < 0 ? 0 : Math.min(i + 1, items.length - 1)]
              : k === 'ArrowUp' ? items[i < 0 ? 0 : Math.max(i - 1, 0)] : null;
      if (t) t.focus();
      return;
    }

    const inDetail = detail.classList.contains('open');
    const rows = rcRows();

    // Barra de secciones
    if (!inDetail && navList.indexOf(ae) >= 0) {
      e.preventDefault();
      const i = navList.indexOf(ae);
      if (k === 'ArrowLeft') rcFocus(navList[Math.max(0, i - 1)]);
      else if (k === 'ArrowRight') rcFocus(navList[Math.min(navList.length - 1, i + 1)]);
      else if (k === 'ArrowDown' && rows.length) rcFocus(rows[0][0]);
      return;   // ↑: el foco se queda en la barra
    }

    // Posición actual dentro de las filas
    let r = -1, c = -1;
    rows.forEach((row, ri) => { const ci = row.indexOf(ae); if (ci >= 0) { r = ri; c = ci; } });
    if (r < 0) {   // foco perdido: se recupera para que el control no quede muerto
      e.preventDefault();
      if (inDetail) { if (rows.length) rcFocus(rows[0][0]); }
      else rcFocus(document.querySelector('#main-nav button.active') || navList[0]);
      return;
    }

    const row = rows[r], cur = row[c];
    if (k === 'ArrowLeft' || k === 'ArrowRight') {
      if (cur.tagName === 'INPUT') {   // en el buscador, ←/→ mueven el cursor hasta llegar al borde del texto
        const atStart = cur.selectionStart === 0 && cur.selectionEnd === 0;
        const atEnd = cur.selectionStart === cur.value.length && cur.selectionEnd === cur.value.length;
        if ((k === 'ArrowLeft' && !atStart) || (k === 'ArrowRight' && !atEnd)) return;
      }
      e.preventDefault();
      const n = row[c + (k === 'ArrowRight' ? 1 : -1)];
      if (n) rcFocus(n);
      return;
    }

    e.preventDefault();
    if (k === 'ArrowDown') {
      const nr = rows[r + 1];
      if (nr) rcFocus(inDetail ? nr[0] : rcNearest(nr, cur));
    } else {   // ArrowUp
      if (r > 0) {
        const pr = rows[r - 1];
        const act = inDetail ? pr.find(b => b.classList.contains('active')) : null;   // de capítulos sube a la temporada activa
        rcFocus(act || rcNearest(pr, cur));
      } else if (!inDetail) {
        rcFocus(document.querySelector('#main-nav button.active') || navList[0]);   // primera fila → sección activa
      }
      // En el detalle, ↑ desde la primera fila no hace nada
    }
  });

  // ---------- Menú ----------
  navButtons.forEach(b => {
    b.addEventListener('click', () => {
      detail.classList.remove('open'); detailCard = null;
      navButtons.forEach(x => x.classList.remove('active'));
      b.classList.add('active');
      const v = b.getAttribute('data-view');
      vistaActual = v;
      if (v === 'movies') showHome('movie');
      else if (v === 'tv') showHome('tv');
      else if (v === 'canales') renderCanales();
      else if (v === 'genres') renderGenres();
      else if (v === 'search') renderSearchView();
    });
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter') b.click(); });
  });

  // ---------- Inicio ----------
  // 1) Abre al instante con lo guardado. 2) Revisa version.json en segundo plano.
  // 3) Lo nuevo se guarda; los canales se refrescan solos, el proveedor/extractor se usan al próximo arranque.
  (async () => {
    let completo = false;
    try { completo = cargarDesdeCache(); } catch (e) { console.error(e); }
    if (!completo) {
      setBoot('Descargando contenido...');
      try { await revisarActualizaciones(); } catch (e) { console.error(e); }
      try { cargarDesdeCache(); } catch (e) { console.error(e); }
    }
    renderCanales();
    setTimeout(() => navButtons[0].focus(), 200);

    if (completo) {
      revisarActualizaciones().then(act => {
        if (act.includes(ARCHIVOS[0].cache)) {
          try { canales = JSON.parse(MEM[ARCHIVOS[0].cache] || LS.get(ARCHIVOS[0].cache) || 'null'); } catch (e) {}
          const enNav = document.activeElement && document.activeElement.closest && document.activeElement.closest('#main-nav');
          if (vistaActual === 'canales' && enNav && !detail.classList.contains('open')) {
            const prev = document.activeElement;
            renderCanales();
            setTimeout(() => { if (prev && document.body.contains(prev)) prev.focus(); }, 50);
          }
        }
      }).catch(e => console.warn(e));
    }
  })();

})();
</script>
